# =============================================================================
# skynetgpu1 — RTX 5070 Ti inference node
# Runs llama-server with CUDA + RPC backend pointing at skynetmem1:50052.
# =============================================================================

name: skynet-gpu

services:
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-cuda
      args:
        CMAKE_CUDA_ARCHITECTURES: "89;120"
    image: skynet/llama-cuda:latest
    container_name: skynetgpu1-llama
    hostname: skynetgpu1

    # Map the mem-node hostname so --rpc skynetmem1:50052 resolves inside the
    # container without depending on the container DNS picking up /etc/hosts.
    extra_hosts:
      - "skynetmem1:${SKYNETMEM1_IP:-192.168.1.20}"

    # GPU access — modern compose syntax. The older `runtime: nvidia` also
    # works but `deploy.resources` is portable across docker compose / swarm.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

    # Models come from the NFS share mounted on the host at $GPU_MODELS_DIR.
    # Read-only inside the container — llama-server never writes here.
    volumes:
      - ${GPU_MODELS_DIR:-/mnt/skynet-models}:/models:ro

    ports:
      - "8080:8080"

    # ─── llama-server arguments ──────────────────────────────────────────────
    command:
      - --model
      - /models/${MODEL_FILE:-Qwen3-Coder-Next-Q4_K_M/Qwen3-Coder-Next-Q4_K_M-00001-of-00004.gguf}
      - --alias
      - Qwen3-Coder-Next

      # HTTP API
      - --host
      - 0.0.0.0
      - --port
      - "8080"

      # Distributed inference: connect to the RAM node's rpc-server.
      - --rpc
      - ${RPC_BACKEND:-skynetmem1:50052}

      # Try to offload every transformer block; tensor-split decides where
      # bytes actually land between local CUDA and the RPC backend.
      - -ngl
      - "999"

      # local-CUDA : RPC byte ratio. With 16 GB VRAM vs ~100 GB RPC pool,
      # 16:100 is a reasonable starting point. Tune in .env.
      - --tensor-split
      - ${TENSOR_SPLIT:-16,100}

      # ── Optional explicit MoE-experts-to-RPC override ──
      # Uncomment for deterministic placement: pins every MoE expert FFN tensor
      # to the RPC backend, keeping attention + routing on the GPU. Often the
      # best throughput-per-VRAM trade-off for MoE models like Qwen3-Coder-Next.
      # - -ot
      # - "\\.ffn_(gate|up|down)_exps\\.=RPC[skynetmem1:50052]"

      # Context window. Model supports 262144 but KV cache scales linearly.
      - -c
      - ${CONTEXT_SIZE:-65536}

      # Flash attention — required for long context, faster, less VRAM.
      - -fa
      - "on"

      # Quantize KV cache to q8_0 → ~50% VRAM savings, negligible quality loss.
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0

      # Don't let llama.cpp silently shift context when full — fail loudly
      # so callers know to summarize/restart.
      - --no-context-shift

      # Qwen3-Coder-Next recommended sampling (per the model card).
      - --jinja
      - --temp
      - "0.7"
      - --top-p
      - "0.8"
      - --top-k
      - "20"
      - --repeat-penalty
      - "1.05"

      # CPU threads for ops that don't go to GPU (sampling, tokenization).
      - --threads
      - ${GPU_THREADS:-8}

      # OpenAI-compatible endpoint metadata.
      - --metrics

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

    restart: unless-stopped

    # llama.cpp does its own threading; let it use the cores it asks for.
    ulimits:
      memlock: -1
      stack: 67108864
