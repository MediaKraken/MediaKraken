services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /data/qdrant:/qdrant/storage

  embedder:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: embedder
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - /data/gguf:/data/gguf
    command:
      - "-m"
      - "/data/gguf/Qwen3-Embedding-0.6B-Q8_0.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8001"
      - "--embeddings"
      - "-c"
      - "32768"
      - "--pooling"
      - "last"
      - "-t"
      - "16"
      - "-b"
      - "8192"
      - "-ub"
      - "8192"
      - "--parallel"
      - "4"
      - "--alias"
      - "qwen3-embedding"