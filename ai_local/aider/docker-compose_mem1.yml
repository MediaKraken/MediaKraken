services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - /data/qdrant:/qdrant/storage
  code-search-mcp-mediakraken:
    build: ./mcp_qdrant
    container_name: code-search-mcp-mediakraken
    restart: unless-stopped
    ports:
      - "9876:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBED_URL: http://skynetgpu1:8001/v1/embeddings
      EMBED_MODEL: qwen3-embedding
      DEFAULT_COLLECTION: mediakraken
      SEARCH_LIMIT: "8"
    depends_on:
      - qdrant
  code-search-mcp-bmo:
    build: ./mcp_qdrant
    container_name: code-search-mcp-bmo
    restart: unless-stopped
    ports:
      - "9877:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBED_URL: http://skynetgpu1:8001/v1/embeddings
      EMBED_MODEL: qwen3-embedding
      DEFAULT_COLLECTION: bmo_core
      SEARCH_LIMIT: "8"
    depends_on:
      - qdrant
  code-search-mcp-dmhelper:
    build: ./mcp_qdrant
    container_name: code-search-mcp-dmhelper
    restart: unless-stopped
    ports:
      - "9878:8000"
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBED_URL: http://skynetgpu1:8001/v1/embeddings
      EMBED_MODEL: qwen3-embedding
      DEFAULT_COLLECTION: wxDMHelper_Cpp
      SEARCH_LIMIT: "8"
    depends_on:
      - qdrant