services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /data/gguf:/data/gguf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0', '1']   # both GPUs
              capabilities: [gpu]
    command:
      - "-m"
      - "/data/gguf/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "-c"
      - "131072"
      - "-ngl"
      - "999"
      - "--tensor-split"
      - "16,10"                 # weight toward the 5070 Ti; leaves ~2GB on the 5070 for the embedder
      # - "--n-cpu-moe"
      # - "30"
      - "-fa"
      - "on"
      - "--cache-type-k"
      - "f16"
      - "--cache-type-v"
      - "f16"
      - "--jinja"
      - "--reasoning-format"
      - "deepseek"
      - "--alias"
      - "qwen36-35b-a3b-ud-q4_k_xl"
      - "--parallel"
      - "1"
      - "-cb"
      - "--temp"
      - "0.6"
      - "--top-p"
      - "0.95"
      - "--top-k"
      - "20"
      - "--min-p"
      - "0"
      - "--presence-penalty"
      - "0.0"
      - "--repeat-penalty"
      - "1.0"

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-latest
    container_name: embedder
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - /data/hf-cache:/data
    environment:
      - MODEL_ID=BAAI/bge-m3
      - MAX_CONCURRENT_REQUESTS=8
      - MAX_CLIENT_BATCH_SIZE=128
      - MAX_BATCH_TOKENS=32768
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']    # pin embedder to the 5070
              capabilities: [gpu]