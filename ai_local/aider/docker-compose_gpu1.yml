services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llamacpp
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /data/gguf:/data/gguf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "-m"
      - "/data/gguf/Qwen3-Coder-30B-A3B-Instruct-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "-c"
      - "65536"
      - "-ngl"
      - "999"
      - "--n-cpu-moe"
      - "26"
      - "-fa"
      - "on"
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
      - "--jinja"
      - "--alias"
      - "qwen3-coder"
      - "--parallel"
      - "4"
      - "-cb"

  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-latest
    container_name: embedder
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - /data/hf-cache:/data
    environment:
      - MODEL_ID=BAAI/bge-m3
      - MAX_CONCURRENT_REQUESTS=8
      - MAX_CLIENT_BATCH_SIZE=128
      - MAX_BATCH_TOKENS=32768
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]