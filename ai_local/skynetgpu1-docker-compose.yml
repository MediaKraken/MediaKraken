services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - /data/gguf:/data/gguf
      - ~/.cache/huggingface:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - "--model"
      - "/data/gguf/Qwen3-Coder-Next-UD-TQ1_0.gguf"
      - "--quantization"
      - "gguf"
      - "--tokenizer"
      - "Qwen/Qwen3-Coder-30B-A3B-Instruct"
      - "--tensor-parallel-size"
      - "2"
      - "--max-num-seqs"
      - "1024"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
  ray-head:
    image: rayproject/ray:latest
    container_name: ray-head
    network_mode: host
    restart: unless-stopped
    shm_size: "30gb"
    volumes:
      - /data:/data:rw
    command:
      - "ray"
      - "start"
      - "--head"
      - "--port=6379"
      - "--dashboard-host=0.0.0.0"
      - "--dashboard-port=8265"
      - "--num-cpus=22"
      - "--num-gpus=1"
      - "--block"