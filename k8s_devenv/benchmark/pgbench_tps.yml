---
apiVersion: v1
kind: Pod
metadata:
  labels:
    io.kompose.service: pgbench-tps
  name: pgbench-tps
  namespace: mkbenchmark
spec:
  containers:
  - name: pgbench-tps
    image: mediakraken/mkpgbench:dev
    command: ["pgbench", "-h", "mkdbinstance.stackgres", "-p", "5432", "-U", "postgres", "-c", "10", "-j", "2", "-t", "10000", "postgres"]
    env:
    - name: PGPASSWORD
      value: 7a75-c67b-4b0f-9ed
  restartPolicy: Never
