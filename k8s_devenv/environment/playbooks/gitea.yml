---
# https://gitea.com/gitea/helm-gitea#installing
- name : Setup gitea on cluster
  hosts: mkcontroldev1
  tasks:
    - name: Add repo
      shell: helm repo add gitea-charts https://dl.gitea.com/charts/

    - name: Install gitea
      shell: helm install gitea oci://registry-1.docker.io/giteacharts/gitea \
        --create-namespace --namespace gitea \
        --set ingress.enabled=true \
        --set ingress.hosts[0].host=mkdevgitea.mediakraken.org \
        --set service.http.type=LoadBalancer \
        --set serviceAccount.create=true \
        --set valkey-cluster.enabled=false \
        --set valkey.enabled=true \
        --set postgresql-ha.enabled=false \
        --set postgresql.enabled=true \
        --set persistence.enabled=true \
        --set persistence.storageClass=longhorn \
        --set gitea.config.database.DB_TYPE=postgres \
        --set gitea.config.indexer.ISSUE_INDEXER_TYPE=bleve \
        --set gitea.config.indexer.REPO_INDEXER_ENABLED=true \
        --set clusterDomain=mkclusterdev.local

