---
# https://artifacthub.io/packages/helm/curie-df-helm-charts/nexus
# Sonatype Nexus is an open source repository manager
- name : Setup nexus on cluster
  hosts: mkcontroldev1
  tasks:
    - name: Add repo
      shell: helm repo add curiedfcharts https://curie-data-factory.github.io/helm-charts

    - name: Install nexus
      shell: helm upgrade --install my-nexus curiedfcharts/nexus \
        --create-namespace --namespace nexus \
        --set service.type=LoadBalancer \
        --set persistence.storageClass=nfs-csi \
        --set ingress.host=mkdevnexus.beaverbay.local
