---
- name : Setup k8s dashboard on cluster
  hosts: mkcontroldev1
  tasks:
    - name: Setup helm repo for dashboard
      shell: helm repo add kubernetes-dashboard https://kubernetes.github.io/dashboard/

    - name: Install dashboard
      shell: helm upgrade --install kubernetes-dashboard kubernetes-dashboard/kubernetes-dashboard --create-namespace --namespace kubernetes-dashboard

    - name: copying file
      copy:
        src: ../config/dashboard-adminuser.yml
        dest: ~/dashboard-adminuser.yml

    - name: Setup access user for dashboard
      shell: kubectl apply -f ~/dashboard-adminuser.yml
