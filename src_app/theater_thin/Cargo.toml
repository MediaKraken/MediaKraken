[package]
name = "theater_thin"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_network = { version = "0.0.265", registry = "kellnr" }

serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt"] }
