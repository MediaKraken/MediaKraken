[package]
name = "theater_thin"
version = "0.0.1"
edition = "2021"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_network = { version="0.0.3", registry = "kellnr" }

fltk = { version = "1.5.4", features = ["fltk-bundled"] }
reqwest = { version = "0.12.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
stdext = "0.3.3"

[dev-dependencies]
tokio-test = "*"
