[package]
name = "theater_thin"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_network = { version = "0.0.237", registry = "kellnr" }

fltk = { version = "1.5.23", features = ["fltk-bundled"] }
serde_json = "1.0.151"
