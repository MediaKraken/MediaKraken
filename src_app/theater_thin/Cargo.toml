[package]
name = "theater_thin"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_network = { version = "0.0.204", registry = "kellnr" }
fltk = { version = "1.5.22", features = ["fltk-bundled"] }
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
stdext = "0.3.3"

[dev-dependencies]
tokio-test = "*"
