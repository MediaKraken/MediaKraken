[package]
name = "theater_controller_pi"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_network = { version = "0.0.136", registry = "kellnr" }

crossbeam = "0.8.4"
crossbeam-channel = "0.5.15"
fltk = { version = "1.5.22", features = ["fltk-bundled"] }
fltk-theme = "0.7.9"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
stdext = "0.3.3"

[dev-dependencies]
tokio-test = "*"
