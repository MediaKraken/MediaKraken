[package]
name = "theater_controller_pi"
version = "0.0.1"
edition = "2021"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_network = { version="0.0.3", registry = "kellnr" }

crossbeam = "0.8.4"
crossbeam-channel = "0.5.13"
fltk = { version = "1.4.32", features = ["fltk-bundled"] }
fltk-theme = "0.7.2"
reqwest = { version = "0.12.5", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
stdext = "0.3.3"

[dev-dependencies]
tokio-test = "*"
