<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
        <meta name="description" content="MediaKraken Audio/Video Streaming Client"/>
        <title>MediaKraken Tizen</title>
        <link rel="stylesheet" href="./static/css/jquery.mobile.min.css"/>
        <link rel="stylesheet" href="./static/css/jqm-docs.css"/>
        <link rel="stylesheet" href="./static/css/style.css"/>
        <link rel="stylesheet" href="./static/css/mediakraken_layout.css"/>
        <script src="./static/js/jquery.min.js"></script>
        <script src="./static/js/jquery.mobile.min.js"></script>
        <script src="./static/js/jqm-docs.js"></script>
        <script src="./static/js/TVKeyValue.js"></script>
        <script src="./static/js/main.js"></script>
    </head>
    <body id="data_background">
        <div data-role="page" id="one" class="type-interior">
            <div data-role="header" data-position="fixed" data-tap-toggle="false">
                <h1>MediaKraken Tizen</h1>
                <a href="index.html" data-icon="home" data-iconpos="notext" data-direction="reverse" class="ui-btn-right jqm-home">Home</a>
            </div>
            <div data-role="content" class="mk-tile-grid">
                <a href="#" class="mk-tile" data-section="movie">
                    <img src="./static/image/movie_ticket.png" alt="Movies" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="audio">
                    <img src="./static/image/headphone.png" alt="Music" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="tv">
                    <img src="./static/image/television.png" alt="TV" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="sports">
                    <img src="./static/image/stadium.png" alt="Sports" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="livetv">
                    <img src="./static/image/television_live.png" alt="Live TV" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="imagegallery">
                    <img src="./static/image/photo.png" alt="Image Gallery" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="games">
                    <img src="./static/image/vid_game.png" alt="Games" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="books">
                    <img src="./static/image/books.png" alt="Books" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="iradio">
                    <img src="./static/image/radio.png" alt="iRadio" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="home_media">
                    <img src="./static/image/vid_camera.png" alt="Home Movies" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="3D">
                    <img src="./static/image/3D.png" alt="3D" height="200" width="200">
                </a>
                <a href="#" class="mk-tile" data-section="internet">
                    <img src="./static/image/planet-earth.png" alt="Internet" height="200" width="200">
                </a>
            </div>
            <div data-role="footer" class="footer-docs" data-position="fixed" data-tap-toggle="false">
                <p>&copy; Quinn Granfor</p>
            </div>
        </div>
    </body>
</html>
