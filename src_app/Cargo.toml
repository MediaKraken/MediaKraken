[workspace]

members = [
    "brother_print_label",
    "mediakraken",
    "pi_upc",
    "pi_voice",
    "theater_controller_pi",
    "theater_full",
    "theater_thin",
]

exclude = ["pi_audio"]

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2
