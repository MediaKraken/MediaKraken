apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-hardwarecontrol
  name: mkstack-hardwarecontrol
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-hardwarecontrol
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-hardwarecontrol
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkhardwarecontrol
          env:
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672
            - name: WAIT_TIMEOUT
              value: "180"
          image: mediakraken/mkhardwarecontrol:dev
          name: mkstack-hardwarecontrol
          volumeMounts:
            - mountPath: /mediakraken/phue
              name: mediakraken-vol-phue
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mediakraken-vol-phue
          persistentVolumeClaim:
            claimName: mediakraken-vol-phue
