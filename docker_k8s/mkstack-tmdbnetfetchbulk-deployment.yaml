apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-tmdbnetfetchbulk
  name: mkstack-tmdbnetfetchbulk
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-tmdbnetfetchbulk
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-tmdbnetfetchbulk
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mktmdbnetfetchbulk
          env:
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672
            - name: WAIT_TIMEOUT
              value: "180"
          image: mediakraken/mktmdbnetfetchbulk:dev
          name: mkstack-tmdbnetfetchbulk
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
