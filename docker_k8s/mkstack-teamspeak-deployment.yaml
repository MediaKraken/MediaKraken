apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-teamspeak
  name: mkstack-teamspeak
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-teamspeak
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-teamspeak
    spec:
      containers:
        - env:
            - name: TS3SERVER_LICENSE
              value: accept
          image: mediakraken/mkchatteamspeak:dev
          name: mkstack-teamspeak
          ports:
            - containerPort: 9987
              protocol: UDP
            - containerPort: 10011
              protocol: TCP
            - containerPort: 30033
              protocol: TCP
          volumeMounts:
            - mountPath: /var/ts3server
              name: mediakraken-vol-teamspeak
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mediakraken-vol-teamspeak
          persistentVolumeClaim:
            claimName: mediakraken-vol-teamspeak
