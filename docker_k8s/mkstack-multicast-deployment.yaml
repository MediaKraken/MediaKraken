apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-multicast
  name: mkstack-multicast
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-multicast
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-multicast
    spec:
      containers:
        - args:
            - sh
            - -c
            - /mkmulticast
          image: mediakraken/mkmulticast:dev
          name: mkstack-multicast
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
