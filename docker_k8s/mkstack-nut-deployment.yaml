apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-nut
  name: mkstack-nut
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-nut
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-nut
    spec:
      containers:
        - env:
            - name: nut-upsd-password
              value: /run/secrets/nut-password
          image: mediakraken/mknut:dev
          name: mkstack-nut
          ports:
            - containerPort: 3493
              protocol: TCP
          volumeMounts:
            - mountPath: /run/secrets
              name: nut-password
              subPath: nut-password
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: nut-password
          secret:
            items:
              - key: nut-password
                path: nut-password
            secretName: nut-password
