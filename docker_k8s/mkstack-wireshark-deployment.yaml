apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-wireshark
  name: mkstack-wireshark
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-wireshark
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-wireshark
    spec:
      containers:
        - env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: TZ
              value: Etc/UTC
          image: linuxserver/wireshark:4.0.11
          name: mkstack-wireshark
          ports:
            - containerPort: 3001
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          volumeMounts:
            - mountPath: /config
              name: mediakraken-vol-wireshark
      restartPolicy: Always
      volumes:
        - name: mediakraken-vol-wireshark
          persistentVolumeClaim:
            claimName: mediakraken-vol-wireshark
