apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-tvheadend
  name: mkstack-tvheadend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-tvheadend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-tvheadend
    spec:
      containers:
        - args:
            - sh
            - -c
            - /mktvheadend
          image: mediakraken/mktvheadend:dev
          name: mkstack-tvheadend
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
