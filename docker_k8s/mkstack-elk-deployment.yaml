apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-elk
  name: mkstack-elk
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-elk
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-elk
    spec:
      containers:
        - env:
            - name: ELASTICSEARCH_START
              value: "1"
            - name: KIBANA_START
              value: "1"
            - name: LOGSTASH_START
              value: "1"
          image: sebp/elk:oss-8.11.1
          name: mkstack-elk
          ports:
            - containerPort: 5601
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/elasticsearch
              name: mediakraken-vol-elk
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mediakraken-vol-elk
          persistentVolumeClaim:
            claimName: mediakraken-vol-elk
