apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-redis
  name: mkstack-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-redis
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-redis
    spec:
      containers:
        - image: eqalpha/keydb:alpine_x86_64_v6.3.4
          name: mkstack-redis
          volumeMounts:
            - mountPath: /data
              name: mediakraken-vol-redis
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mediakraken-vol-redis
          persistentVolumeClaim:
            claimName: mediakraken-vol-redis
