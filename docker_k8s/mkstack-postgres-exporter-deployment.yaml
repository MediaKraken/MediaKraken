apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-postgres-exporter
  name: mkstack-postgres-exporter
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-postgres-exporter
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-postgres-exporter
    spec:
      containers:
        - env:
            - name: DATA_SOURCE_PASS_FILE
              value: /run/secrets/db-password
            - name: DATA_SOURCE_URI
              value: mkstack-database:5432/postgres?sslmode=disable
            - name: DATA_SOURCE_USER
              value: postgres
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          name: mkstack-postgres-exporter
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
      restartPolicy: Always
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
