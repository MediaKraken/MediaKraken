apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-postgres-exporter
  name: mkstack-postgres-exporter
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-postgres-exporter-service
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-postgres-exporter-service
    spec:
      containers:
        - env:
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: mkstack-db-password.txt              
            - name: DATA_SOURCE_URI
              value: mkstack-database:5432/postgres?sslmode=disable
            - name: DATA_SOURCE_USER
              value: postgres
          # https://github.com/prometheus-community/postgres_exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
          name: mkstack-postgres-exporter
      restartPolicy: Always
