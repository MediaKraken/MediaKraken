apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-metadatamame
  name: mkstack-metadatamame
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-metadatamame-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-metadatamame-service
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkmetadatamame
          env:
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: mkstack-db-password.txt
          image: mediakraken/mkmetadatamame:dev
          imagePullPolicy: Always
          name: mkstack-metadatamame
          volumeMounts:
            - mountPath: /mediakraken/emulation
              name: mkstack-emulation-claim
            - mountPath: /mediakraken/static
              name: mkstack-static-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-emulation-claim
          persistentVolumeClaim:
            claimName: mkstack-emulation-claim
        - name: mkstack-static-claim
          persistentVolumeClaim:
            claimName: mkstack-static-claim
