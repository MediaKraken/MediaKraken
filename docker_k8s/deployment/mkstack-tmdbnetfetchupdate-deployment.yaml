apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-tmdbnetfetchupdate
  name: mkstack-tmdbnetfetchupdate
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-tmdbnetfetchupdate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-tmdbnetfetchupdate
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mktmdbnetfetchupdate
          env:
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672
            - name: WAIT_TIMEOUT
              value: "180"
          image: mediakraken/mktmdbnetfetchupdate:dev
          name: mkstack-tmdbnetfetchupdate
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
