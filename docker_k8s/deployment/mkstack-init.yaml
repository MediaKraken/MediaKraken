apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-init
  name: mkstack-init
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-init-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-init-service
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - args:
            - sh
            - -c
            - /wait && /init
          env:
            - name: WAIT_HOSTS
              value: mkstack-database-service:5432
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: mkstack-db-password.txt
          image: mediakraken/init:dev
          imagePullPolicy: Always
          name: mkstack-download
          volumeMounts:
            - mountPath: /mediakraken/certs
              name: mkstack-certs-claim
            - mountPath: /mediakraken/static
              name: mkstack-static-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-static-claim
          persistentVolumeClaim:
            claimName: mkstack-static-claim
        - name: mkstack-certs-claim
          persistentVolumeClaim:
            claimName: mkstack-certs-claim
