apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-webapp
  name: mkstack-webapp
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-webapp-service
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-webapp-service
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - args:
            - sh
            - -c
            - /wait && /mediakraken/mkwebapp
          env:
            - name: LANG
              value: en_US.UTF-8
            - name: LC_ALL
              value: en_US.UTF-8
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672, mkstack-redis:6379
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: mkstack-db-password.txt
          image: mediakraken/mkwebaxum:dev
          name: mkstack-webapp
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /mediakraken/static
              name: mkstack-static-claim
            - mountPath: /mediakraken/certs
              name: mkstack-certs-claim
            - mountPath: /Comics
              name: mkstack-comics-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-static-claim
          persistentVolumeClaim:
            claimName: mkstack-static-claim
        - name: mkstack-certs-claim
          persistentVolumeClaim:
            claimName: mkstack-certs-claim
        - name: mkstack-comics-claim
          persistentVolumeClaim:
            claimName: mkstack-comics-claim
