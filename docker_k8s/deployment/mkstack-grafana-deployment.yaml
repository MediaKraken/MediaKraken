apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-grafana
  name: mkstack-grafana
  namespace: mediakraken
spec:
  securityContext:
    fsGroup: 472
    runAsGroup: 472
    runAsNonRoot: true
    runAsUser: 472 
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-grafana-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-grafana-service
    spec:
      containers:
        - env:
            - name: GF_INSTALL_PLUGINS
              value: redis-datasource
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: metaman
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          # https://hub.docker.com/r/grafana/grafana-oss/tags
          image: grafana/grafana-oss:11.1.0
          name: mkstack-grafana
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/grafana
              name: mkstack-grafana-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-grafana-claim
          persistentVolumeClaim:
            claimName: mkstack-grafana-claim
