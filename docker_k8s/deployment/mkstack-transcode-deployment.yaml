apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-transcode
  name: mkstack-transcode
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-transcode-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-transcode-service
    spec:
      containers:
        - args:
            - sh
            - -c
            - /mktranscode
          image: mediakraken/mktranscode:dev
          name: mkstack-transcode
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
            - mountPath: /mediakraken/mnt
              name: mkstack-transcode-claim
              readOnly: true
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
        - name: mkstack-transcode-claim
          persistentVolumeClaim:
            claimName: mkstack-transcode-claim
            readOnly: true
