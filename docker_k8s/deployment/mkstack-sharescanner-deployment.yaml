apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-sharescanner
  name: mkstack-sharescanner
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-sharescanner-service
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-sharescanner-service
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mksharescanner
          env:
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: mkstack-db-password.txt
          image: mediakraken/mksharescanner:dev
          name: mkstack-sharescanner
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
