apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-mediascanner
  name: mkstack-mediascanner
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-mediascanner
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-mediascanner
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkmediascanner
          env:
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672
            - name: WAIT_TIMEOUT
              value: "180"
          image: mediakraken/mkmediascanner:dev
          name: mkstack-mediascanner
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
            - mountPath: /mediakraken/static
              name: mediakraken-vol-static
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
        - name: mediakraken-vol-static
          persistentVolumeClaim:
            claimName: mediakraken-vol-static
