apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-elk
  name: mkstack-elk
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-elk
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-elk
    spec:
      containers:
        - env:
            - name: ELASTICSEARCH_START
              value: "1"
            - name: KIBANA_START
              value: "1"
            - name: LOGSTASH_START
              value: "1"
          # https://hub.docker.com/r/sebp/elk/
          image: sebp/elk:oss-8.13.4
          name: mkstack-elk
          ports:
            - containerPort: 5601
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/elasticsearch
              name: mediakraken-vol-elk
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mediakraken-vol-elk
          persistentVolumeClaim:
            claimName: mediakraken-vol-elk
