apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-redis
  name: mkstack-redis
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-redis-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-redis-service
    spec:
      containers:
        # https://hub.docker.com/r/eqalpha/keydb
        - image: eqalpha/keydb:alpine_x86_64_v6.3.4
          name: mkstack-redis
          volumeMounts:
            - mountPath: /data
              name: mediakraken-vol-redis
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mediakraken-vol-redis
          persistentVolumeClaim:
            claimName: mediakraken-vol-redis
