apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-teamspeak
  name: mkstack-teamspeak
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-teamspeak-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-teamspeak-service
    spec:
      containers:
        - env:
            - name: TS3SERVER_LICENSE
              value: accept
          image: mediakraken/mkchatteamspeak:dev
          name: mkstack-teamspeak
          ports:
            - containerPort: 9987
              protocol: UDP
            - containerPort: 10011
              protocol: TCP
            - containerPort: 30033
              protocol: TCP
          volumeMounts:
            - mountPath: /var/ts3server
              name: mkstack-teamspeak-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-teamspeak-claim
          persistentVolumeClaim:
            claimName: mkstack-teamspeak-claim
