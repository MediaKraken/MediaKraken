apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-libretrocorefetchupdate
  name: mkstack-libretrocorefetchupdate
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-libretrocorefetchupdate
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-libretrocorefetchupdate
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mklibretrocorefetchupdate
          env:
            - name: WAIT_HOSTS
              value: mkstack-rabbitmq:5672
            - name: WAIT_TIMEOUT
              value: "180"
          image: mediakraken/mklibretrocorefetchupdate:dev
          name: mkstack-libretrocorefetchupdate
          volumeMounts:
            - mountPath: /mediakraken/emulation
              name: mediakraken-vol-emulation
            - mountPath: /mediakraken/static
              name: mediakraken-vol-static
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mediakraken-vol-emulation
          persistentVolumeClaim:
            claimName: mediakraken-vol-emulation
        - name: mediakraken-vol-static
          persistentVolumeClaim:
            claimName: mediakraken-vol-static
