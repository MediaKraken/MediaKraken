apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-webapp
  name: mkstack-webapp
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-webapp-service
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-webapp-service
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mediakraken/mkwebapp
          env:
            - name: LANG
              value: en_US.UTF-8
            - name: LC_ALL
              value: en_US.UTF-8
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672, mkstack-redis:6379
            - name: WAIT_TIMEOUT
              value: "180"
          image: mediakraken/mkwebaxum:dev
          name: mkstack-webapp
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
            - mountPath: /run/secrets
              name: secure-key
              subPath: secure-key
            - mountPath: /run/secrets
              name: csrf-key
              subPath: csrf-key
            - mountPath: /mediakraken/static
              name: mkstack-static-claim
            - mountPath: /mediakraken/certs
              name: mkstack-certs-claim
            - mountPath: /Comics
              name: mkstack-comics-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
        - name: secure-key
          secret:
            items:
              - key: secure-key
                path: secure-key
            secretName: secure-key
        - name: csrf-key
          secret:
            items:
              - key: csrf-key
                path: csrf-key
            secretName: csrf-key
        - name: mkstack-static-claim
          persistentVolumeClaim:
            claimName: mkstack-static-claim
        - name: mkstack-certs-claim
          persistentVolumeClaim:
            claimName: mkstack-certs-claim
        - name: mkstack-comics-claim
          persistentVolumeClaim:
            claimName: mkstack-comics-claim

