apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-metadata
  name: mkstack-metadata
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-metadata-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-metadata-service
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkmetadata
          env:
            - name: WAIT_HOSTS
              value: mkstack-database:5432, mkstack-rabbitmq:5672
            - name: WAIT_TIMEOUT
              value: "180"
          image: mediakraken/mkmetadata:dev
          name: mkstack-metadata
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
            - mountPath: /mediakraken/static
              name: mkstack-static-claim
            - mountPath: /mediakraken/cache
              name: mkstack-cache-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
        - name: mkstack-static-claim
          persistentVolumeClaim:
            claimName: mkstack-static-claim
        - name: mkstack-cache-claim
          persistentVolumeClaim:
            claimName: mkstack-cache-claim
