apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: mkstack-transcode
  name: mkstack-transcode
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-transcode
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: mkstack-transcode
    spec:
      containers:
        - args:
            - sh
            - -c
            - /mktranscode
          image: mediakraken/mktranscode:dev
          name: mkstack-transcode
          volumeMounts:
            - mountPath: /run/secrets
              name: db-password
              subPath: db-password
            - mountPath: /mediakraken/mnt
              name: mkstack-transcode-claim0
              readOnly: true
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      volumes:
        - name: db-password
          secret:
            items:
              - key: db-password
                path: db-password
            secretName: db-password
        - name: mkstack-transcode-claim0
          persistentVolumeClaim:
            claimName: mkstack-transcode-claim0
            readOnly: true
