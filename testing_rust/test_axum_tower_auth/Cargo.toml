[package]
name = "mkaxumtowerauthminimal"
version = "0.0.1"
edition = "2021"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
#mk_lib_database = { version = "0.0.12", registry = "kellnr" }

anyhow = "1.0.86"
async-trait = "0.1.80"
axum = { version = "0.7.5", features = ["http2", "json", "ws"] }
axum-extra = "0.9.3"
axum-login = "0.15.3"
axum-server = { version = "0.6.0", features = ["tls-rustls"] }
axum_static = "1.7.1"
chrono = { version = "0.4.38", features = ["serde"] }
lazy_static = "1.4.0"
libc = "0.2.155"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sqlx = { version = "0.7.4", features = [
    "chrono",
    "json",
    "runtime-tokio",
    "postgres",
    "sqlite",
    "time",
    "uuid",
] }
stdext = "0.3.1"
time = "0.3.36"
tokio = { version = "1.38.0", features = ["full"] }
tower = { version = "0.4.13" }
tower-sessions = { version = "0.12.2", default-features = false, features = [
    "signed",
] }
tower-sessions-sqlx-store = { version = "0.12.0", features = ["sqlite"] }
urlencoding = "2.1.3"
uuid = { version = "1.9.1", features = ["serde", "v4"] }

[dev-dependencies]
tokio-test = "*"
