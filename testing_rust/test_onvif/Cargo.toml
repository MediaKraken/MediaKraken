[package]
name = "mktestonvif"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
mk_lib_hardware = { path = "../../src/mk_lib_hardware" }
tokio = { version = "1.35.1", features = ["full"] }
tokio-test = "*"
