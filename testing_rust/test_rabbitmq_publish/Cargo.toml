[package]
name = "mkrabbitmqpublish"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
mk_lib_rabbitmq = { path = "../../src/mk_lib_rabbitmq" }
serde_json = "1.0.111"
tokio = { version = "1.35.1", features = ["full"] }
