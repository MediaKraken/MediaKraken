[package]
name = "mktestdockerapirunningapi"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
docker-api = { version = "0.14.0", features = ["swarm"] }
tokio = { version = "1.35.1", features = ["full"] }
