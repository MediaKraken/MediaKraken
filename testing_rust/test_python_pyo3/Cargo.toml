[package]
name = "mktestpythonpyo3"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
pyo3 = { version = "0.18.3", default-features = true }
