[package]
name = "mkrabbitconsume"
version = "0.0.1"
edition = "2021"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.22", registry = "kellnr" }
mk_lib_network = { version = "0.0.4", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.6", registry = "kellnr" }

chrono = { version = "0.4.38", features = ["serde"] }
reqwest = { version = "0.12.5", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rustls = "0.23.10"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.38.1", features = ["full"] }
uuid = { version = "1.10.0", features = ["serde", "v4"] }

[dev-dependencies]
tokio-test = "*"
