[package]
name = "mkrabbitconsume"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.245", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.217", registry = "kellnr" }

serde_json = "1.0.148"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
