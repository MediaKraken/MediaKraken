[package]
name = "mklibretrocorefetchupdate"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_compression = { version = "0.0.168", registry = "kellnr" }
mk_lib_hash = { version = "0.0.173", registry = "kellnr" }
mk_lib_logging = { version = "0.0.170", registry = "kellnr" }
mk_lib_network = { version = "0.0.170", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.173", registry = "kellnr" }

chrono = { version = "0.4.43", features = ["serde"] }
crc32fast = "1.5.0"
flate2 = "1.1.5"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
stdext = "0.3.3"
sys-info = "0.9.1"
tar = "0.4.44"
tokio = { version = "1.49.0", features = ["full"] }
walkdir = "2.5.0"
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
