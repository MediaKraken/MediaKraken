[package]
name = "mklibretrocorefetchupdate"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_compression = { version = "0.0.236", registry = "kellnr" }
mk_lib_hash = { version = "0.0.240", registry = "kellnr" }
mk_lib_logging = { version = "0.0.238", registry = "kellnr" }
mk_lib_network = { version = "0.0.237", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.241", registry = "kellnr" }

amqprs = "2.1.3"
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.0"
flate2 = "1.1.9"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stdext = "0.3.3"
sys-info = "0.9.1"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["full"] }
walkdir = "2.5.0"
uuid = { version = "1.23.2", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
