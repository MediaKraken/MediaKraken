[package]
name = "mkgamesdbnetfetchbulk"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.258", registry = "kellnr" }
mk_lib_logging = { version = "0.0.227", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.230", registry = "kellnr" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
