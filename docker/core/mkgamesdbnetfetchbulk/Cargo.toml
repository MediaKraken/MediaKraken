[package]
name = "mkgamesdbnetfetchbulk"
version = "0.0.1"
edition = "2021"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.20", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.4", registry = "kellnr" }

serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1.38.0", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
