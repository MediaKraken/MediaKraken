[package]
name = "mkwebapp"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_common = { version = "0.0.237", registry = "kellnr" }
mk_lib_database = { version = "0.0.269", registry = "kellnr" }
mk_lib_logging = { version = "0.0.238", registry = "kellnr" }
mk_lib_metadata = { version = "0.0.249", registry = "kellnr" }
mk_lib_network = { version = "0.0.237", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.241", registry = "kellnr" }
mk_lib_share = { version = "0.0.246", registry = "kellnr" }

askama = "0.16.0"
askama_axum = "0.4.0"
async-trait = "0.1.89"
aws-config = "1.8.12"
aws-sdk-s3 = "1.119.0"
axum = { version = "0.8.9", features = ["form", "http2", "json", "multipart", "ws", "macros"] }
axum-client-ip = "1.3.1"
axum_csrf = "0.11.0"
axum-extra = { version = "0.12.6", features = ["routing"]}
axum-flash = { git = "https://github.com/aumetra/axum-flash", rev = "0832703" }
axum-messages = "0.8.0"
axum-prometheus = "0.10.1"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
axum_session = { version = "0.21.0", default-features = false, features = [
    "advanced",
    "key-store",
] }
axum_session_auth = { version = "0.21.0", default-features = false, features = [
    "advanced",
    "key-store",
] }
axum_session_sqlx = {version = "0.11.0", features = ["postgres", "tls-rustls"]}
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
ipnetwork = "0.21.1"
lazy_static = "1.5.0"
libc = "0.2.189"
num-format = { version = "0.4.4", features = ["with-system-locale"] }
paginator = "0.2.7"
redis_pool = "0.10.1"
redis = { version = "1.6.0" }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "chrono",
    "ipnetwork",
    "json",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = { version = "0.5.3", features = ["retry", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
tower-sessions = "0.15.0"
transmission-rpc = "0.5.0"
uuid = { version = "1.24.1", features = ["serde", "v4", "v7"] }
urlencoding = "2.1.3"
validator = { version = "0.21.0", features = ["derive"] }


[dev-dependencies]
tokio-test = "*"
