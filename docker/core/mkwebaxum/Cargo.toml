[package]
name = "mkwebapp"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.6", registry = "kellnr" }
mk_lib_database = { version = "0.0.33", registry = "kellnr" }
mk_lib_file = { version = "0.0.14", registry = "kellnr" }
mk_lib_metadata = { version = "0.0.17", registry = "kellnr" }
mk_lib_network = { version = "0.0.15", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.10", registry = "kellnr" }

askama = { version = "0.12.1", features = ["with-axum", "mime", "mime_guess"] }
askama_axum = "0.4.0"
askama-filters = "0.1.3"
async-trait = "0.1.82"
axum = { version = "0.7.7", features = ["form", "http2", "json", "ws"] }
axum-client-ip = "0.6.1"
axum_csrf = "0.10.1"
axum-extra = "0.9.4"
axum-flash = "0.8.0"
axum-handle-error-extract = "0.1.0"
axum-prometheus = "0.7.0"
axum-server = { version = "0.7.1", features = ["tls-rustls"] }
axum_session = { version = "0.14.4", default-features = false, features = [
    "advanced",
    "key-store",
] }
axum_session_auth = { version = "0.14.1", default-features = false, features = [
    "advanced",
    "key-store",
] }
axum_session_sqlx = {version = "0.3.0", features = ["postgres", "tls-rustls"]}
bytesize = { version = "2.0.1", features = ["serde"] }
chrono = { version = "0.4.40", features = ["serde"] }
futures = "0.3.31"
hyper = { version = "1.6.0", features = ["full"] }
hyper-util = { version = "0.1.10", features = ["client-legacy"] }
ipnetwork = "0.20.0"
lazy_static = "1.5.0"
libc = "0.2.171"
num-format = { version = "0.4.4", features = ["with-system-locale"] }
paginator = "0.2.6"
redis_pool = "0.7.0"
redis = { version = "0.29.1" }
reqwest = { version = "0.12.14", default-features = false, features = [
    "json",
    "native-tls",
] }
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.3", features = [
    "chrono",
    "ipnetwork",
    "json",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.44.1", features = ["full"] }
tower = { version = "0.5.2", features = ["retry", "timeout", "util"] }
tower-http = { version = "0.6.2", features = ["fs"] }
transmission-rpc = "0.5.0"
uuid = { version = "1.15.1", features = ["serde", "v4", "v7"] }
validator = { version = "0.20.0", features = ["derive"] }


[dev-dependencies]
tokio-test = "*"
