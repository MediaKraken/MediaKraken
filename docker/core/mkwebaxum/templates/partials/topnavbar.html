<header class="sticky top-0 z-[100] w-full bg-white dark:bg-zinc-900 shadow-sm">
    <nav class="bg-transparent">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="relative flex items-center justify-between h-16">

                <!-- Left -->
                <div class="flex-1 flex items-center justify-start">
                    <div class="flex-shrink-0 flex items-center">
                        <img class="h-8 w-auto" src="/static/image/K3.png" alt="MediaKraken Logo">
                        <span class="ml-2 text-xl font-bold text-gray-800 dark:text-zinc-100 hidden md:block">
                            MediaKraken
                        </span>
                    </div>

                    <div class="hidden sm:ml-6 sm:flex sm:space-x-1">
                        <a href="/user/home" class="px-3 py-2 rounded-md text-sm font-medium
                                  text-gray-700 dark:text-zinc-300
                                  hover:bg-gray-100 dark:hover:bg-zinc-800">
                            Home
                        </a>

                        <a href="/user/sync/1" class="px-3 py-2 rounded-md text-sm font-medium
                                  text-gray-700 dark:text-zinc-300
                                  hover:bg-gray-100 dark:hover:bg-zinc-800">
                            Sync
                        </a>

                        <!-- Metadata dropdown -->
                        <div class="relative group">
                            <button class="px-3 py-2 rounded-md text-sm font-medium flex items-center
                                       text-gray-700 dark:text-zinc-300
                                       hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors">
                                Metadata
                                <svg class="ml-1 h-4 w-4 transition-transform group-hover:rotate-180" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>

                            <div class="absolute left-0 mt-2 w-[500px]
                                       bg-white dark:bg-zinc-800
                                       border border-gray-200 dark:border-zinc-700
                                       rounded-xl shadow-xl
                                       opacity-0 invisible group-hover:opacity-100 group-hover:visible
                                       transition-all duration-200
                                       origin-top-left scale-95 group-hover:scale-100
                                       z-[999]">
                                <div class="grid grid-cols-2 gap-6 p-6">
                                    <div>
                                        <h3 class="text-xs font-bold uppercase tracking-wider mb-3
                                                   text-indigo-600 dark:text-indigo-400">
                                            Video
                                        </h3>
                                        <ul class="space-y-2">
                                            <li><a href="/user/metadata/movie/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Movie</a></li>
                                            <li><a href="/user/metadata/movie_collection/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Movie Collection</a></li>
                                            <li><a href="/user/metadata/tv/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    TV Show</a></li>
                                            <li><a href="/user/metadata/sports/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Sports</a></li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h3 class="text-xs font-bold uppercase tracking-wider mb-3
                                                   text-indigo-600 dark:text-indigo-400">
                                            Media & People
                                        </h3>
                                        <ul class="space-y-2">
                                            <li><a href="/user/metadata/game/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Game</a></li>
                                            <li><a href="/user/metadata/music/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Music</a></li>
                                            <li><a href="/user/metadata/book/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Periodical</a></li>
                                            <li><a href="/user/metadata/person/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Person</a></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <a href="/user/profile" class="px-3 py-2 rounded-md text-sm font-medium
                                  text-gray-700 dark:text-zinc-300
                                  hover:bg-gray-100 dark:hover:bg-zinc-800">
                            Profile
                        </a>

                        <a href="/admin/home" class="px-3 py-2 rounded-md text-sm font-medium
                                  text-gray-700 dark:text-zinc-300
                                  hover:bg-gray-100 dark:hover:bg-zinc-800
                                  border-l border-gray-200 dark:border-zinc-700 pl-4">
                            Admin
                        </a>
                    </div>
                </div>

                <!-- Right -->
                <div class="flex items-center space-x-3">
                    <!-- Theme toggle -->
                    <button @click="$store.ui.toggleTheme()"
                        class="rounded-lg p-2 hover:bg-gray-100 dark:hover:bg-zinc-800">
                        <svg x-show="!$store.ui.dark" class="h-5 w-5 text-gray-700">
                            <!-- sun -->
                        </svg>

                        <svg x-show="$store.ui.dark" x-cloak class="h-5 w-5 text-zinc-300">
                            <!-- moon -->
                        </svg>
                    </button>
                    <!-- Mobile sidebar button -->
                    <button @click="$store.ui.toggleSidebar()"
                        class="md:hidden rounded-lg p-2 hover:bg-gray-100 dark:hover:bg-zinc-800">
                        ☰
                    </button>
                    <a href="/public/login" class="px-3 py-2 text-sm font-medium
                              text-gray-700 dark:text-zinc-300
                              hover:text-indigo-600 dark:hover:text-indigo-400">
                        Login
                    </a>

                    <a href="#" class="bg-indigo-600 text-white px-4 py-2 rounded-lg
                              text-sm font-semibold hover:bg-indigo-700 transition shadow-sm">
                        Sign Up
                    </a>
                </div>

            </div>
        </div>
    </nav>
</header>
