<header class="sticky top-0 z-[100] w-full bg-white dark:bg-zinc-900 shadow-sm">
    <nav class="bg-transparent">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="relative flex items-center justify-between h-16">

                <!-- Left -->
                <div class="flex-1 flex items-center justify-start">
                    <div class="flex-shrink-0 flex items-center">
                        <img class="h-8 w-auto" src="/static/image/K3.png" alt="MediaKraken Logo">
                        <span class="ml-2 text-xl font-bold text-gray-800 dark:text-zinc-100 hidden md:block">
                            MediaKraken
                        </span>
                    </div>

                    <div class="hidden sm:ml-6 sm:flex sm:space-x-1">
                        <a href="/user/home" class="px-3 py-2 rounded-md text-sm font-medium
                                  text-gray-700 dark:text-zinc-300
                                  hover:bg-gray-100 dark:hover:bg-zinc-800">
                            Home
                        </a>

                        <a href="/user/sync/1" class="px-3 py-2 rounded-md text-sm font-medium
                                  text-gray-700 dark:text-zinc-300
                                  hover:bg-gray-100 dark:hover:bg-zinc-800">
                            Sync
                        </a>

                        <!-- Metadata dropdown -->
                        <div class="relative group">
                            <button class="px-3 py-2 rounded-md text-sm font-medium flex items-center
                                       text-gray-700 dark:text-zinc-300
                                       hover:bg-gray-100 dark:hover:bg-zinc-800 transition-colors">
                                Metadata
                                <svg class="ml-1 h-4 w-4 transition-transform group-hover:rotate-180" fill="none"
                                    viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>

                            <div class="absolute left-0 mt-2 w-[500px]
                                       bg-white dark:bg-zinc-800
                                       border border-gray-200 dark:border-zinc-700
                                       rounded-xl shadow-xl
                                       opacity-0 invisible group-hover:opacity-100 group-hover:visible
                                       transition-all duration-200
                                       origin-top-left scale-95 group-hover:scale-100
                                       z-[999]">
                                <div class="grid grid-cols-2 gap-6 p-6">
                                    <div>
                                        <h3 class="text-xs font-bold uppercase tracking-wider mb-3
                                                   text-indigo-600 dark:text-indigo-400">
                                            Video
                                        </h3>
                                        <ul class="space-y-2">
                                            <li><a href="/user/metadata/movie/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Movie</a></li>
                                            <li><a href="/user/metadata/movie_collection/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Movie Collection</a></li>
                                            <li><a href="/user/metadata/tv/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    TV Show</a></li>
                                            <li><a href="/user/metadata/sports/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Sports</a></li>
                                        </ul>
                                    </div>
                                    <div>
                                        <h3 class="text-xs font-bold uppercase tracking-wider mb-3
                                                   text-indigo-600 dark:text-indigo-400">
                                            Media & People
                                        </h3>
                                        <ul class="space-y-2">
                                            <li><a href="/user/metadata/game/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Game</a></li>
                                            <li><a href="/user/metadata/music/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Music</a></li>
                                            <li><a href="/user/metadata/book/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Periodical</a></li>
                                            <li><a href="/user/metadata/person/1" class="text-sm text-gray-600 dark:text-zinc-300
                                                          hover:text-indigo-600 dark:hover:text-indigo-400">
                                                    Person</a></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <a href="/user/profile" class="px-3 py-2 rounded-md text-sm font-medium
                                  text-gray-700 dark:text-zinc-300
                                  hover:bg-gray-100 dark:hover:bg-zinc-800">
                            Profile
                        </a>

                        <!-- Center Search -->
                        <div class="hidden md:flex flex-1 justify-center px-6">
                            <div x-data="{ open: false, filter: 'available', query: '' }" class="w-full max-w-lg">
                                <div class="flex">

                                    <!-- Dropdown -->
                                    <div class="relative">
                                        <button @click="open = !open" type="button" class="inline-flex items-center px-3 py-2 border border-r-0
                           border-gray-300 dark:border-zinc-700
                           bg-gray-100 dark:bg-zinc-800
                           text-sm rounded-l-lg
                           hover:bg-gray-200 dark:hover:bg-zinc-700 transition">
                                            <span x-text="filter === 'available' ? 'Available' : 'All'"></span>
                                            <svg class="ml-2 h-4 w-4 transition-transform"
                                                :class="{ 'rotate-180': open }" fill="none" viewBox="0 0 24 24"
                                                stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                    d="M19 9l-7 7-7-7" />
                                            </svg>
                                        </button>

                                        <!-- Dropdown Menu -->
                                        <div x-show="open" @click.outside="open = false" x-transition class="absolute z-50 mt-1 w-36
                           bg-white dark:bg-zinc-800
                           border border-gray-200 dark:border-zinc-700
                           rounded-lg shadow-lg">
                                            <button @click="filter = 'available'; open = false" class="block w-full text-left px-4 py-2 text-sm
                               hover:bg-gray-100 dark:hover:bg-zinc-700">
                                                Available
                                            </button>
                                            <button @click="filter = 'all'; open = false" class="block w-full text-left px-4 py-2 text-sm
                               hover:bg-gray-100 dark:hover:bg-zinc-700">
                                                All
                                            </button>
                                        </div>
                                    </div>

                                    <!-- Search Input -->
                                    <div class="relative w-full">
                                        <input type="text" x-model="query"
                                            @keydown.enter="$dispatch('navbar-search', { query, filter })"
                                            placeholder="Search media..." class="w-full px-4 py-2 border
                           border-gray-300 dark:border-zinc-700
                           bg-white dark:bg-zinc-900
                           text-sm rounded-r-lg
                           focus:outline-none
                           focus:ring-2 focus:ring-indigo-500" />

                                        <!-- Search Icon -->
                                        <svg class="absolute right-3 top-2.5 h-4 w-4
                           text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <a href="/admin/home" class="px-3 py-2 rounded-md text-sm font-medium
                                  text-gray-700 dark:text-zinc-300
                                  hover:bg-gray-100 dark:hover:bg-zinc-800
                                  border-l border-gray-200 dark:border-zinc-700 pl-4">
                            Admin
                        </a>
                    </div>
                </div>

                <!-- Right -->
                <div class="flex items-center space-x-3">
                    <button @click="$store.ui.toggleTheme()" type="button"
                        class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 dark:text-zinc-400 dark:hover:bg-zinc-800 focus:outline-none transition-colors"
                        aria-label="Toggle dark mode">
                        <svg x-show="$store.ui.dark" x-cloak class="h-5 w-5" xmlns="http://www.w3.org/2000/svg"
                            fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M3 12h2.25m.386-6.364l1.591-1.591M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
                        </svg>

                        <svg x-show="!$store.ui.dark" class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                        </svg>
                    </button>

                    <button @click="$store.ui.toggleSidebar()"
                        class="md:hidden rounded-lg p-2 text-gray-500 hover:bg-gray-100 dark:text-zinc-400 dark:hover:bg-zinc-800">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>

                    <a href="/public/login" class="px-3 py-2 text-sm font-medium
              text-gray-700 dark:text-zinc-300
              hover:text-indigo-600 dark:hover:text-indigo-400">
                        Login
                    </a>

                    <a href="#" class="bg-indigo-600 text-white px-4 py-2 rounded-lg
              text-sm font-semibold hover:bg-indigo-700 transition shadow-sm">
                        Sign Up
                    </a>
                </div>

            </div>
        </div>
    </nav>
</header>
