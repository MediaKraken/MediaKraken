<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaKraken – 401</title>

<link rel="stylesheet" href="/static/css/base_webapp_9.css">
</head>

<body class="min-h-screen flex flex-col bg-gray-100">

  {% include "bss_user/bss_user_include_menu.html" %}

  <!-- Main content -->
  <main class="flex-1 flex items-center justify-center px-4">
    <div class="bg-white rounded-xl shadow-lg max-w-xl w-full p-8 text-center">

      <h1 class="text-3xl font-bold text-gray-800 mb-4">
        401 – Must be a verified user
      </h1>

      <div class="flex justify-center mb-6">
        <img
          src="/static/image/browser.png"
          alt="Unauthorized"
          loading="lazy" decoding="async"
          class="max-w-xs"
        >
      </div>

      <p class="text-gray-600">
        You are not authorized to see this page.
        Please
        <a href="/public/login" class="font-semibold text-indigo-600 hover:underline">
          log in
        </a>
        or
        <br>
        <a href="/public/register" class="font-semibold text-indigo-600 hover:underline">
          create a new account
        </a>.
      </p>

    </div>
  </main>

  {% include "bss_public/bss_public_footer.html" %}
  <script src="/static/js/alpinejs_3.15.3.min.js" defer></script>
  <script src="/static/js/base_webapp.js" defer></script>
</body>
</html>
