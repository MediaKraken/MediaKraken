<!DOCTYPE html>
<html lang="en" x-data>
{% include "bss_include_header.html" %}
<body class="bg-gray-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col transition-colors duration-300">

<div class="flex min-h-screen flex-col">
    {% include "bss_user/bss_user_include_menu.html" %}

    <div class="flex flex-1">
        {% include "bss_admin/bss_admin_include_menu.html" %}

        <!-- Main Content -->
        <main class="flex-grow container mx-auto p-4">
            <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 shadow rounded-lg p-6">
                <h2 class="text-lg font-semibold mb-4 text-zinc-900 dark:text-zinc-100">User Details</h2>

                <!-- Example User Detail Fields -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-zinc-700 dark:text-zinc-200">Username:</label>
                        <p class="mt-1 text-zinc-900 dark:text-zinc-100">john_doe</p>
                    </div>
                    <div>
                        <label class="block font-medium text-zinc-700 dark:text-zinc-200">Email:</label>
                        <p class="mt-1 text-zinc-900 dark:text-zinc-100">john@example.com</p>
                    </div>
                    <div>
                        <label class="block font-medium text-zinc-700 dark:text-zinc-200">Role:</label>
                        <p class="mt-1 text-zinc-900 dark:text-zinc-100">Administrator</p>
                    </div>
                    <div>
                        <label class="block font-medium text-zinc-700 dark:text-zinc-200">Status:</label>
                        <p class="mt-1 text-green-600 dark:text-green-400">Active</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-6 flex space-x-4">
                    <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                        Edit User
                    </button>
                    <button class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
                            @click="if(confirm('Are you sure you want to delete this user?')) alert('User deleted!')">
                        Delete User
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Footer -->
    {% include "bss_public/bss_public_footer.html" %}
</div>
</body>
</html>
