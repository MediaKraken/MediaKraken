<!DOCTYPE html>
<html lang="en" x-data>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaKraken - User Detail</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.12.0/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header/Menu -->
    <header class="bg-white shadow p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold">MediaKraken</h1>
        <!-- Include your menus here -->
        <nav class="space-x-4">
            <!-- Example menu links -->
            <a href="#" class="text-blue-600 hover:underline">Dashboard</a>
            <a href="#" class="text-blue-600 hover:underline">Users</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto p-4">
        <div class="bg-white shadow rounded-lg p-6">
            <h2 class="text-lg font-semibold mb-4">User Details</h2>

            <!-- Example User Detail Fields -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-medium text-gray-700">Username:</label>
                    <p class="mt-1 text-gray-900">john_doe</p>
                </div>
                <div>
                    <label class="block font-medium text-gray-700">Email:</label>
                    <p class="mt-1 text-gray-900">john@example.com</p>
                </div>
                <div>
                    <label class="block font-medium text-gray-700">Role:</label>
                    <p class="mt-1 text-gray-900">Administrator</p>
                </div>
                <div>
                    <label class="block font-medium text-gray-700">Status:</label>
                    <p class="mt-1 text-green-600">Active</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mt-6 flex space-x-4">
                <button class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
                    Edit User
                </button>
                <button class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700"
                        @click="if(confirm('Are you sure you want to delete this user?')) alert('User deleted!')">
                    Delete User
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow p-4 mt-6 text-center text-gray-500">
        <!-- Include your footer template here -->
        &copy; 2026 MediaKraken. All rights reserved.
    </footer>

</body>
</html>
