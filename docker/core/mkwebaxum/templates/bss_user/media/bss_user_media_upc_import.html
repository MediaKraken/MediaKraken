<!DOCTYPE html>
<html lang="en">

{% include "bss_include_header.html" %}

<body>

    <body class="min-h-screen flex flex-col bg-gray-100 text-gray-900">
        <!-- Top navbar -->
        {% include "bss_user/bss_user_include_menu.html" %}
        <!-- Below top nav -->
        <div class="flex flex-1">
            <!-- Left sidebar -->
            {% include "partials/sidebar_user.html" %}
            <!-- Main content -->
            <main class="flex-1 p-6 bg-gray-50 overflow-y-auto">
                <div>
                    <h2>Import Text File (Up to 500 Lines)</h2>
                    <input type="file" id="fileInput" accept=".txt">
                    <textarea id="output" placeholder="Imported lines will appear here..."></textarea>
                    <br><br>
                    <a href="/user/media/bss_user_media_upc_import_submit">
                        <button type="button">Submit UPC(s)</button>
                    </a>
                </div>
                {% include "bss_public/bss_public_footer.html" %}
                <script>
                    document.getElementById('fileInput').addEventListener('change', function () {
                        const file = this.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function (e) {
                            const lines = e.target.result.split(/\r?\n/);
                            const first50Lines = lines.slice(0, 50).join('\n');
                            document.getElementById('output').value = first50Lines;
                        };
                        reader.readAsText(file);
                    });
                </script>
            </main>
        </div>
         
    </body>

</html>
