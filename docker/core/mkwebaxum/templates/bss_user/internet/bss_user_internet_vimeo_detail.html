{% extends "layouts/base_user.html" %}

{% block content %}
<main class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <a href="/user/internet/vimeo" class="mb-4 inline-flex items-center gap-2 rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm text-zinc-700 shadow-sm transition-colors hover:border-zinc-300 hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:border-zinc-500 dark:hover:bg-zinc-800" aria-label="Back to Vimeo browse">
        <span aria-hidden="true">&larr;</span> Back to Vimeo
    </a>

    <article class="rounded-xl border border-zinc-200 bg-white p-4 shadow-sm sm:p-6 dark:border-zinc-800 dark:bg-zinc-900">
        <header class="mb-4 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">Vimeo Playback</h1>
                <p class="text-sm text-zinc-500 dark:text-zinc-400">Video ID: {{ video_id }}</p>
            </div>
            <a href="{{ watch_url }}" target="_blank" rel="noopener noreferrer"
                class="inline-flex items-center justify-center rounded-lg border border-zinc-200 px-4 py-2 text-sm text-zinc-700 transition-colors hover:border-zinc-300 hover:bg-zinc-50 dark:border-zinc-700 dark:text-zinc-300 dark:hover:border-zinc-500 dark:hover:bg-zinc-800"
                aria-label="Open Vimeo video {{ video_id }} on vimeo.com">
                Open on Vimeo
            </a>
        </header>

        <div class="aspect-video w-full overflow-hidden rounded-lg border border-zinc-200 bg-black dark:border-zinc-800">
            <iframe
                src="{{ embed_url }}"
                title="Vimeo player for {{ video_id }}"
                class="h-full w-full"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                loading="lazy"
            ></iframe>
        </div>
    </article>
</main>
{% endblock %}
