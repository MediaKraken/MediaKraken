{% extends "layouts/base_user.html" %}

{% block content %}
<main class="mx-auto w-full max-w-5xl px-4 py-6 sm:px-6 lg:px-8">
    <a href="/user/internet/flickr" class="mb-4 inline-flex items-center gap-2 rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm text-zinc-700 shadow-sm transition-colors hover:border-zinc-300 hover:bg-zinc-50 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-300 dark:hover:border-zinc-500 dark:hover:bg-zinc-800" aria-label="Back to Flickr browse">
        <span aria-hidden="true">&larr;</span> Back to Flickr
    </a>

    <article class="rounded-xl border border-zinc-200 bg-white p-5 shadow-sm dark:border-zinc-800 dark:bg-zinc-900">
        <header class="flex flex-col gap-4 sm:flex-row">
            <img src="{{ item.image_url }}" alt="{{ item.title }}" class="h-72 w-full rounded-lg bg-zinc-100 object-cover sm:w-80 dark:bg-zinc-800" loading="lazy" decoding="async">
            <div class="min-w-0 space-y-1">
                <p class="text-xs font-semibold uppercase tracking-wide text-indigo-500 dark:text-indigo-300">Flickr Photo ID: {{ item.id }}</p>
                <h1 class="mt-1 text-3xl font-bold tracking-tight text-zinc-900 dark:text-zinc-100">{{ item.title }}</h1>
                <p class="text-zinc-600 dark:text-zinc-300">{{ item.author }}</p>
                <p class="text-sm text-zinc-500 dark:text-zinc-400">Published: {{ item.published }}</p>
                <p class="text-sm text-zinc-500 dark:text-zinc-400">Tags: {{ item.tags }}</p>
                <a href="{{ item.link_url }}" target="_blank" rel="noopener noreferrer"
                    class="mt-3 inline-flex items-center justify-center rounded-lg bg-teal-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-teal-500"
                    aria-label="Open Flickr photo {{ item.id }} on flickr.com">
                    Open on Flickr
                </a>
            </div>
        </header>

        <section class="mt-5">
            <h2 class="text-lg font-semibold text-zinc-900 dark:text-zinc-100">Description</h2>
            <p class="mt-2 whitespace-pre-wrap text-zinc-600 dark:text-zinc-300">{{ item.description }}</p>
        </section>
    </article>
</main>
{% endblock %}
