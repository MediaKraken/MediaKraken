{% extends "layouts/base_user.html" %}

{% block extra_head %}
<style>
    .youtube-player-shell {
        height: calc(100vh - 10rem);
        min-height: 420px;
    }
</style>
{% endblock %}

{% block content %}
<div class="space-y-4">
    <a href="/user/internet/youtube"
        class="inline-flex items-center gap-2 text-sm font-medium text-indigo-600 transition-colors hover:text-indigo-500 dark:text-indigo-400 dark:hover:text-indigo-300"
        aria-label="Back to YouTube browse page">
        <span aria-hidden="true">&larr;</span> Back to YouTube browse
    </a>

    <div class="youtube-player-shell w-full overflow-hidden rounded-xl border border-zinc-200 bg-black shadow-sm dark:border-zinc-800">
        <iframe
            src="{{ template_embed_url }}"
            title="YouTube player for {{ template_youtube_video_guid }}"
            class="h-full w-full"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
        ></iframe>
    </div>
</div>
{% endblock %}
