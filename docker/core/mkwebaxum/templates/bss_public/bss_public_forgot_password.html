<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaKraken – Forgotten Password</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/fonts/fontawesome-all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-600 to-purple-700 flex flex-col">

  <!-- Centered content -->
  <main class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-5xl bg-white rounded-xl shadow-2xl overflow-hidden">

      <div class="grid grid-cols-1 lg:grid-cols-2">

        <!-- Image panel -->
        <div
          class="hidden lg:block bg-cover bg-center"
          style="background-image: url('/static/image/K3.png');">
        </div>

        <!-- Form panel -->
        <div class="p-8 md:p-12">
          <div class="text-center mb-6">
            <h4 class="text-2xl font-semibold text-gray-800 mb-2">
              Forgot Your Password?
            </h4>
            <p class="text-sm text-gray-600">
              We get it, stuff happens. Just enter your email address below and
              we’ll send you a link to reset your password!
            </p>
          </div>

          <form method="post" class="space-y-4">

            <input
              type="email"
              name="email"
              required
              placeholder="Enter email address…"
              class="w-full rounded-lg border border-gray-300 px-4 py-2
                     focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700
                     text-white font-semibold py-2 rounded-lg
                     transition">
              Reset Password
            </button>

          </form>

          <div class="mt-6 text-center text-sm space-y-2">
            <hr class="my-4">

            <a href="/public/register" class="text-indigo-600 hover:underline block">
              Create an Account!
            </a>

            <a href="/public/login" class="text-indigo-600 hover:underline block">
              Already have an account? Login!
            </a>
          </div>
        </div>

      </div>
    </div>
  </main>

  {% include "bss_public/bss_public_footer.html" %}
  <script src="/static/js/alpinejs_3.15.3.min.js" defer></script>
  <script src="/static/js/base_webapp.js" defer></script>
</body>
</html>
