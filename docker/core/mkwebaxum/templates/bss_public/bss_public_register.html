<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaKraken – Register</title>
  <link rel="stylesheet" href="/static/css/base_webapp_9.css">
  <link rel="stylesheet" href="/static/fonts/fontawesome-all.min.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-600 to-purple-700 flex flex-col">

  <!-- Centered register container -->
  <main class="flex-1 flex items-center justify-center px-4">
    <div class="w-full max-w-5xl bg-white rounded-xl shadow-2xl overflow-hidden">

      <div class="grid grid-cols-1 lg:grid-cols-2">

        <!-- Left image (hidden on small screens) -->
        <div
          class="hidden lg:block bg-cover bg-center"
          style="background-image: url('/static/image/K3.png');">
        </div>

        <!-- Register form -->
        <div class="p-8 md:p-12">
          <div class="text-center mb-6">
            <h4 class="text-2xl font-semibold text-gray-800">
              Create an Account!
            </h4>
          </div>

          <form action="/public/register" method="post" class="space-y-4">

            <input
              type="text"
              name="username"
              required
              placeholder="Username"
              class="w-full rounded-lg border border-gray-300 px-4 py-2
                     focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <input
              type="password"
              name="password"
              required
              placeholder="Password"
              class="w-full rounded-lg border border-gray-300 px-4 py-2
                     focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >

            <button
              type="submit"
              class="w-full bg-indigo-600 hover:bg-indigo-700
                     text-white font-semibold py-2 rounded-lg
                     transition">
              Register Account
            </button>

          </form>

          <div class="mt-6 space-y-2 text-center text-sm">
            <a href="/public/forgot" class="text-indigo-600 hover:underline">
              Forgot Password?
            </a>
            <div>
              <a href="/public/login" class="text-indigo-600 hover:underline">
                Already have an account? Login!
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  {% include "bss_public/bss_public_footer.html" %}
  <script src="/static/js/alpinejs_3.15.3.min.js" defer></script>
  <script src="/static/js/base_webapp.js" defer></script>
 </body>
</html>
