<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if let Some(title) = page_title %}
        {{ title }}
        {% else %}
        MediaKraken
        {% endif %}
    </title>
    <link rel="stylesheet" href="/static/css/base_webapp_1.css">
    <script src="/static/js/alpinejs_3.15.3.min.js" defer></script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('theme', {
                dark: localStorage.theme === 'dark',
                toggle() {
                    this.dark = !this.dark
                    localStorage.theme = this.dark ? 'dark' : 'light'
                    document.documentElement.classList.toggle('dark', this.dark)
                },
                init() {
                    document.documentElement.classList.toggle('dark', this.dark)
                }
            })
        })
    </script>
</head>

<body x-init="$store.theme.init()"
    class="min-h-screen flex flex-col bg-zinc-100 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 transition-colors">
    {% include "partials/topnavbar.html" %}
    <div class="flex flex-1 overflow-hidden">
        {% include "partials/sidebar_user.html" %}
        <main id="main-content" class="flex-1 overflow-y-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% include "bss_public/bss_public_footer.html" %}
</body>

</html>
