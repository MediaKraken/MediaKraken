<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if let Some(title) = page_title %}
        {{ title }}
        {% else %}
        MediaKraken
        {% endif %}
    </title>
    <link rel="stylesheet" href="/static/css/base_webapp_8.css">
    <script src="/static/js/alpinejs_3.15.3.min.js" defer></script>
    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('theme', {
                dark: localStorage.theme === 'dark',
                toggle() {
                    this.dark = !this.dark
                    localStorage.theme = this.dark ? 'dark' : 'light'
                    document.documentElement.classList.toggle('dark', this.dark)
                },
                init() {
                    document.documentElement.classList.toggle('dark', this.dark)
                }
            })
        })
    </script>    
</head>

<body class="min-h-screen flex flex-col bg-gray-100 text-gray-900">
    {% include "partials/topnavbar.html" %}
    <div class="flex flex-1">
        {% include "partials/sidebar_admin.html" %}

        {% block content %}{% endblock %}
    </div>s
</body>

</html>
