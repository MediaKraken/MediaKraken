[package]
name = "mkfanotify"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.248", registry = "kellnr" }
mk_lib_logging = { version = "0.0.217", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.220", registry = "kellnr" }

chrono = { version = "0.4.43", features = ["serde"] }
fanotify-rs = "0.3.1"
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
