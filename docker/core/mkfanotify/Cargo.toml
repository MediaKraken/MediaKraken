[package]
name = "mkfanotify"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.265", registry = "kellnr" }
mk_lib_logging = { version = "0.0.234", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.237", registry = "kellnr" }

chrono = { version = "0.4.45", features = ["serde"] }
fanotify-rs = "0.3.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
