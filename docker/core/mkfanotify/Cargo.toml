[package]
name = "mkfanotify"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.173", registry = "kellnr" }
mk_lib_logging = { version = "0.0.142", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.145", registry = "kellnr" }

chrono = { version = "0.4.43", features = ["serde"] }
fanotify-rs = "0.3.1"
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
