[package]
name = "mkglobalcache"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.40", registry = "kellnr" }
mk_lib_network = { version = "0.0.11", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.14", registry = "kellnr" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
