[package]
name = "mkglobalcache"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.267", registry = "kellnr" }
mk_lib_network = { version = "0.0.235", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.239", registry = "kellnr" }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
] }
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
