[package]
name = "mkglobalcache"
version = "0.0.1"
edition = "2021"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.22", registry = "kellnr" }
mk_lib_network = { version = "0.0.4", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.6", registry = "kellnr" }

serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
tokio = { version = "1.38.1", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
