[package]
name = "mksharescanner"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.43", registry = "kellnr" }
mk_lib_network = { version = "0.0.13", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.15", registry = "kellnr" }

chrono = { version = "0.4.40", features = ["serde"] }
ipnet = "2.9.0"
reqwest = { version = "0.12.14", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.44.1", features = ["full"] }
uuid = { version = "1.16.0", features = ["serde", "v4", "v7"] }
walkdir = "2.5.0"

[dev-dependencies]
tokio-test = "*"
