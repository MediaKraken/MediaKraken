[package]
name = "mksharescanner"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.269", registry = "kellnr" }
mk_lib_logging = { version = "0.0.238", registry = "kellnr" }
mk_lib_network = { version = "0.0.237", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.241", registry = "kellnr" }

chrono = { version = "0.4.45", features = ["serde"] }
ipnet = "2.11.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = [
    "chrono",
    "ipnetwork",
    "json",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.23.2", features = ["serde", "v4", "v7"] }
walkdir = "2.5.0"

[dev-dependencies]
tokio-test = "*"
