[package]
name = "mksharescanner"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.235", registry = "kellnr" }
mk_lib_logging = { version = "0.0.204", registry = "kellnr" }
mk_lib_network = { version = "0.0.204", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.207", registry = "kellnr" }

amqprs = "2.1.3"
serde_json = "1.0.148"
sqlx = { version = "0.8.6", default-features = false, features = [
    "runtime-tokio",
    "postgres",
] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
