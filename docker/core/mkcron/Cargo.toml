[package]
name = "mkcron"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.66", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.39", registry = "kellnr" }

chrono = { version = "0.4.40", features = ["serde"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
