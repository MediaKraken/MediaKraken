[package]
name = "mkcron"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.267", registry = "kellnr" }
mk_lib_logging = { version = "0.0.236", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.239", registry = "kellnr" }

chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.150"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
