[package]
name = "mkcron"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.136", registry = "kellnr" }
mk_lib_logging = { version = "0.0.105", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.108", registry = "kellnr" }

chrono = { version = "0.4.43", features = ["serde"] }
serde_json = "1.0.148"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
