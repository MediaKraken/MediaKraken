[package]
name = "mkopenlibrarynetfetchbulk"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_compression = { version = "0.0.232", registry = "kellnr" }
mk_lib_database = { version = "0.0.265", registry = "kellnr" }
mk_lib_file = { version = "0.0.243", registry = "kellnr", features = ["s3"] }
mk_lib_logging = { version = "0.0.234", registry = "kellnr" }
mk_lib_network = { version = "0.0.233", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.237", registry = "kellnr" }

anyhow = "1.0.102"
async-compression = { version = "0.4.42", features = ["tokio", "gzip"] }
aws-config = "1.8.8"
aws-sdk-s3 = "1.119.0"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.9"
futures = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
stdext = "0.3.3"
sys-info = "0.9.1"
tar = "0.4.45"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
uuid = { version = "1.23.2", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
