[package]
name = "mkopenlibrarynetfetchbulk"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_compression = { version = "0.0.164", registry = "kellnr" }
mk_lib_database = { version = "0.0.197", registry = "kellnr" }
mk_lib_logging = { version = "0.0.166", registry = "kellnr" }
mk_lib_network = { version = "0.0.166", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.169", registry = "kellnr" }

anyhow = "1.0.102"
async-compression = { version = "0.4.40", features = ["tokio", "gzip"] }
chrono = { version = "0.4.43", features = ["serde"] }
flate2 = "1.1.9"
futures = "0.3.32"
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
stdext = "0.3.3"
sys-info = "0.9.1"
tar = "0.4.44"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
uuid = { version = "1.21.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
