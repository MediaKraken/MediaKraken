[package]
name = "mkopenlibrarynetfetchbulk"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_compression = { version = "0.0.6", registry = "kellnr" }
mk_lib_database = { version = "0.0.28", registry = "kellnr" }
mk_lib_network = { version = "0.0.14", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.10", registry = "kellnr" }

chrono = { version = "0.4.38", features = ["serde"] }
flate2 = "1.0.30"
reqwest = { version = "0.12.9", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
stdext = "0.3.3"
sys-info = "0.9.1"
tar = "0.4.41"
tokio = { version = "1.41.0", features = ["full"] }
uuid = { version = "1.11.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
