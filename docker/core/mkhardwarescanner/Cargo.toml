[package]
name = "mkhardwarescanner"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.255", registry = "kellnr" }
mk_lib_hardware = { version = "0.0.228", registry = "kellnr" }
mk_lib_logging = { version = "0.0.224", registry = "kellnr" }
mk_lib_network = { version = "0.0.223", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.227", registry = "kellnr" }

chrono = { version = "0.4.45", features = ["serde"] }
crab-dlna = "0.2.1"
futures-util = "0.3.31"
huelib = "0.13.2" # https://github.com/nn1ks/huelib-rs
mdns = "3.0.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sonor = "2.0.0"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
