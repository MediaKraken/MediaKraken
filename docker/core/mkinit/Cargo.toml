[package]
name = "mkinit"
version = "0.0.1"
edition = "2021"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.20", registry = "kellnr" }

# 13+ breaks my code
rcgen = "0.12.1"
tokio = { version = "1.38.0", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
