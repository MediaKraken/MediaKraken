[package]
name = "mkiradio"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.197", registry = "kellnr" }
mk_lib_logging = { version = "0.0.166", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.169", registry = "kellnr" }

async-std = { version = "1.13.2", features = ["attributes"] }
chrono = { version = "0.4.44", features = ["serde"] }
radiobrowser = "0.6.1"
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
