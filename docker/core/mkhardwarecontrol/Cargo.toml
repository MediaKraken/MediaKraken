[package]
name = "mkhardwarecontrol"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_hardware = { version = "0.0.231", registry = "kellnr" }
mk_lib_logging = { version = "0.0.226", registry = "kellnr" }
mk_lib_network = { version = "0.0.225", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.229", registry = "kellnr" }

chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
rppal = { version = "0.22.1", features = ["hal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
