[package]
name = "mkhardwarecontrol"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_hardware = { version = "0.0.32", registry = "kellnr" }
mk_lib_network = { version = "0.0.28", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.31", registry = "kellnr" }

chrono = { version = "0.4.40", features = ["serde"] }
reqwest = { version = "0.12.14", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rppal = { version = "0.22.1", features = ["hal"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.44.1", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
