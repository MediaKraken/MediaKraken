[package]
name = "mkmetadata"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.103", registry = "kellnr" }
mk_lib_database = { version = "0.0.135", registry = "kellnr" }
mk_lib_logging = { version = "0.0.104", registry = "kellnr" }
mk_lib_metadata = { version = "0.0.115", registry = "kellnr" }
mk_lib_network = { version = "0.0.104", registry = "kellnr" }

chrono = { version = "0.4.43", features = ["serde"] }
flate2 = "1.1.1"
futures = "0.3.31"
governor = "0.8.1"
musicbrainz_rs = "0.9.0"
nonzero_ext = "0.3.0"
open-library = "0.7.1"
rand = "0.9.1"
ratelimit = "0.10.0"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "native-tls",
] }
roxmltree = "0.20.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
sqlx = { version = "0.8.6", features = [
    "chrono",
    "ipnetwork",
    "json",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
stdext = "0.3.3"
substring = "1.4.5"
sys-info = "0.9.1"
tar = "0.4.41"
tokio = { version = "1.49.0", features = ["full"] }
torrent-name-parser = "0.12.1"
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }
md-5 = "0.10.6"
sha-1 = "0.10.1"

[dev-dependencies]
tokio-test = "*"
