[package]
name = "mkmetadata"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.258", registry = "kellnr" }
mk_lib_logging = { version = "0.0.227", registry = "kellnr" }
mk_lib_metadata = { version = "0.0.238", registry = "kellnr" }
mk_lib_network = { version = "0.0.226", registry = "kellnr" }

ratelimit = "0.10.0"
serde_json = "1.0.150"
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio",
] }
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
