[package]
name = "mkmetadata"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.236", registry = "kellnr" }
mk_lib_logging = { version = "0.0.205", registry = "kellnr" }
mk_lib_metadata = { version = "0.0.216", registry = "kellnr" }
mk_lib_network = { version = "0.0.206", registry = "kellnr" }

ratelimit = "0.10.0"
serde_json = "1.0.148"
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio",
] }
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
