[package]
name = "mkmetadata"
version = "0.0.1"
edition = "2021"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.2", registry = "kellnr" }
mk_lib_database = { version = "0.0.22", registry = "kellnr" }
mk_lib_metadata = { version = "0.0.9", registry = "kellnr" }

chrono = { version = "0.4.38", features = ["serde"] }
flate2 = "1.0.28"
futures = "0.3.30"
governor = "0.6.3"
musicbrainz_rs = "0.5.0"
nonzero_ext = "0.3.0"
open-library = "0.7.1"
rand = "0.8.5"
reqwest = { version = "0.12.5", default-features = false, features = [
    "json",
    "native-tls",
] }
roxmltree = "0.20.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
sqlx = { version = "0.7.4", features = [
    "chrono",
    "ipnetwork",
    "json",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
stdext = "0.3.3"
substring = "1.4.5"
sys-info = "0.9.1"
tar = "0.4.41"
tokio = { version = "1.38.1", features = ["full"] }
torrent-name-parser = "0.12.1"
uuid = { version = "1.10.0", features = ["serde", "v4", "v7"] }
md-5 = "0.10.6"
sha-1 = "0.10.1"

[dev-dependencies]
tokio-test = "*"
