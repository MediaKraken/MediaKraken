[package]
name = "mkmetadatamame"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_compression = { version = "0.0.236", registry = "kellnr" }
mk_lib_database = { version = "0.0.269", registry = "kellnr" }
mk_lib_logging = { version = "0.0.238", registry = "kellnr" }
mk_lib_network = { version = "0.0.237", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.241", registry = "kellnr" }

amqprs = "2.1.3"
async-std = "1.13.2"
sqlx = { version = "0.9.0", default-features = false, features = [
     "postgres",
     "runtime-tokio",
 ] }
chrono = { version = "0.4.45", features = ["serde"] }
quickxml_to_serde = { version = "0.6.0", features = ["json_types"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
] }
rustls = "0.23.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.53.1", features = ["full"] }
walkdir = "2.5.0"
uuid = { version = "1.23.2", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
