[package]
name = "mkmetadatamame"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_compression = { version = "0.0.215", registry = "kellnr" }
mk_lib_database = { version = "0.0.248", registry = "kellnr" }
mk_lib_logging = { version = "0.0.217", registry = "kellnr" }
mk_lib_network = { version = "0.0.218", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.220", registry = "kellnr" }

async-std = "1.13.1"
chrono = { version = "0.4.43", features = ["serde"] }
quickxml_to_serde = { version = "0.6.0", features = ["json_types"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "native-tls",
] }
rustls = "0.23.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.49.0", features = ["full"] }
walkdir = "2.5.0"
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
