[package]
name = "mkinotify"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.256", registry = "kellnr" }
mk_lib_logging = { version = "0.0.225", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.228", registry = "kellnr" }

chrono = { version = "0.4.45", features = ["serde"] }
inotify = "0.11.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
rustls = "0.23.40"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
