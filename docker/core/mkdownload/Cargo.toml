[package]
name = "mkdownload"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.246", registry = "kellnr" }
mk_lib_network = { version = "0.0.216", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.218", registry = "kellnr" }

reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
urlencoding = "2.1.3"
validator = { version = "0.20.0", features = ["derive"] }


[dev-dependencies]
tokio-test = "*"
