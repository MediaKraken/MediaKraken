[package]
name = "mkdownload"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.257", registry = "kellnr" }
mk_lib_network = { version = "0.0.225", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.229", registry = "kellnr" }

reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
urlencoding = "2.1.3"
validator = { version = "0.20.0", features = ["derive"] }


[dev-dependencies]
tokio-test = "*"
