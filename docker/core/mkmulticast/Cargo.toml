[package]
name = "mkmulticast"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
# 0.31.0 breaks datalink
pnet = "0.30.0"
shiplift = { version = "0.7", default-features = false, features = [
    "unix-socket",
] }
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tokio-test = "*"
