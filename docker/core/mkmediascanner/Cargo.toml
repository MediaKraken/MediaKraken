[package]
name = "mkmediascanner"
version = "0.0.1"
edition = "2021"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.2", registry = "kellnr" }
mk_lib_database = { version = "0.0.20", registry = "kellnr" }
mk_lib_file = { version = "0.0.3", registry = "kellnr", features=["smb"] }
mk_lib_rabbitmq = { version = "0.0.6", registry = "kellnr" }

chrono = { version = "0.4.38", features = ["serde"] }
fancy-regex = "0.13.0"
lazy_static = "1.5.0"
num-format = "0.4.4"
reqwest = { version = "0.12.5", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rustls = "0.23.10"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.38.0", features = ["full"] }
uuid = { version = "1.9.1", features = ["serde", "v4"] }
walkdir = "2.5.0"

[dev-dependencies]
tokio-test = "*"
