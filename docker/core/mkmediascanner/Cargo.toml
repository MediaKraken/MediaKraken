[package]
name = "mkmediascanner"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.213", registry = "kellnr" }
mk_lib_database = { version = "0.0.245", registry = "kellnr" }
mk_lib_logging = { version = "0.0.214", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.217", registry = "kellnr" }
mk_lib_share = { version = "0.0.222", registry = "kellnr" }

amqprs = "2.1.3"
chrono = { version = "0.4.43", features = ["serde"] }
fancy-regex = "0.14.0"
lazy_static = "1.5.0"
num-format = "0.4.4"
serde_json = "1.0.148"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
