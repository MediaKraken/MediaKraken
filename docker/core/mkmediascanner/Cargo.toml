[package]
name = "mkmediascanner"
version = "0.0.1"
edition = "2024"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.124", registry = "kellnr" }
mk_lib_database = { version = "0.0.156", registry = "kellnr" }
mk_lib_file = { version = "0.0.133", registry = "kellnr", features=["smb"] }
   # features=["nfs", "smb"] }
mk_lib_logging = { version = "0.0.125", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.128", registry = "kellnr" }

chrono = { version = "0.4.43", features = ["serde"] }
fancy-regex = "0.14.0"
lazy_static = "1.5.0"
num-format = "0.4.4"
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rustls = "0.23.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }
walkdir = "2.5.0"

[dev-dependencies]
tokio-test = "*"
