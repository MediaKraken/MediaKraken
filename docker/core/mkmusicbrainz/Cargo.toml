[package]
name = "mkmusicbrainz"
version = "0.0.1"
edition = "2024"


[dependencies]
mk_lib_database = { version = "0.0.267", registry = "kellnr" }
mk_lib_logging = { version = "0.0.236", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.239", registry = "kellnr" }

reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
] }
rustls = "0.23.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = [
    "chrono",
    "ipnetwork",
    "json",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
