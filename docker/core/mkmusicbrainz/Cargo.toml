[package]
name = "mkmusicbrainz"
version = "0.0.1"
edition = "2021"

[profile.dev]
panic = 'unwind'
strip = "none"
lto = false
codegen-units = 16

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.20", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.5", registry = "kellnr" }

reqwest = { version = "0.12.5", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rustls = "0.23.10"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.38.0", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
