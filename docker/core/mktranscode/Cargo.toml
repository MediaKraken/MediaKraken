[package]
name = "mktranscode"
version = "0.0.1"
edition = "2024"

[profile.release]
opt-level = 3          # Maximum optimization level for performance
lto = "fat"            # Link-Time Optimization: "fat" allows cross-crate optimization (try "thin" if compile times get too long)
codegen-units = 1      # Forces the compiler to process the crate as a single unit, maximizing optimization opportunities
panic = "abort"        # Removes unwinding infrastructure, reducing binary size and sometimes improving performance
strip = true           # Removes debug symbols from the binary to reduce size (optional)

[dependencies]
mk_lib_common = { version = "0.0.272", registry = "kellnr" }
mk_lib_compression = { version = "0.0.271", registry = "kellnr" }
mk_lib_database = { version = "0.0.308", registry = "kellnr" }
mk_lib_file = { version = "0.0.282", registry = "kellnr" }
mk_lib_logging = { version = "0.0.273", registry = "kellnr" }
mk_lib_rabbitmq = { version = "0.0.277", registry = "kellnr" }

chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stdext = "0.3.3"
sys-info = "0.9.1"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.23.2", features = ["serde", "v4", "v7"] }
