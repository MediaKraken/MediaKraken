[workspace]
resolver = "3"

members = [
    "mkcron",
    "mkdownload",
    "mkfanotify",
    "mkgamesdbnetfetchbulk",
    "mkglobalcache",
    "mkhardwarecontrol",
    "mkhardwarescanner",
    "mkinit",
    "mkinotify",
    "mkiradio",
    "mklibretrocorefetchupdate",
    "mkmediascanner",
    "mkmetadata",
    "mkmetadatamame",
    "mkmulticast",
    "mkmusicbrainz",
    "mkopenlibrarynetfetchbulk",
    "mkrabbitconsume",
    "mkschedulesdirectupdate",
    "mksharescanner",
    "mktmdbnetfetchbulk",
    "mktranscode",
    "mkwebaxum",
]

[profile.dev]
panic = 'unwind'
strip = "none"

[profile.release]
opt-level = 3          # Maximum optimization level for performance
lto = "fat"            # Link-Time Optimization: "fat" allows cross-crate optimization (try "thin" if compile times get too long)
codegen-units = 1      # Forces the compiler to process the crate as a single unit, maximizing optimization opportunities
panic = "abort"        # Removes unwinding infrastructure, reducing binary size and sometimes improving performance
strip = true           # Removes debug symbols from the binary to reduce size (optional)


[patch.crates-io]
hyper = { git = "https://github.com/hyperium/hyper", tag = "v0.10.16" }
