[package]
name = "mk_lib_rabbitmq"
version = "0.0.277"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[dependencies]
amqprs = "2.1.5"
tokio = { version = "1.53.1", features = ["time"] }
