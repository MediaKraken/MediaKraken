[package]
name = "mk_lib_file"
version = "0.0.257"
edition = "2024"
[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
aws-config = { version = "1.11.0", optional = true }
aws-sdk-s3 = { version = "1.143.0", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
    "query",
], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
tokio = { version = "1.53.1", features = ["full"] }
walkdir = "2.5.0"

[features]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
garage-admin = ["dep:reqwest", "dep:serde"]

[dev-dependencies]
tokio-test = "*"
