[package]
name = "mk_lib_file"
version = "0.0.19"
edition = "2024"
[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.41", registry = "kellnr", optional = true }

aws-config = { version = "1.6.0", optional = true }
aws-sdk-s3 = { version = "1.79.0", optional = true }
libnfs = { version = "0.1.1", optional = true }
nix = {version = "0.29.0", optional = true }
pavao = { version = "0.2.10", optional = true }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
walkdir = "2.5.0"

[features]
nfs = ["nix", "libnfs", "mk_lib_database"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
share = ["mk_lib_database"]
smb = ["pavao", "mk_lib_database"]

[dev-dependencies]
tokio-test = "*"
