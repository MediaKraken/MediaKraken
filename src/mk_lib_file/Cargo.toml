[package]
name = "mk_lib_file"
version = "0.0.218"
edition = "2024"
[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_database = { version = "0.0.241", registry = "kellnr", optional = true }
mk_lib_logging = { version = "0.0.210", registry = "kellnr" }

aws-config = { version = "1.8.16", optional = true }
aws-sdk-s3 = { version = "1.131.0", optional = true }
libnfs = { version = "0.1.1", optional = true }
nix = {version = "0.31.2", optional = true }
pavao = { version = "0.2.16", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "native-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
walkdir = "2.5.0"

[features]
nfs = ["nix", "libnfs", "mk_lib_database"]
s3 = ["dep:aws-config", "dep:aws-sdk-s3"]
garage-admin = ["dep:reqwest", "dep:serde"]
share = ["mk_lib_database"]
smb = ["pavao", "mk_lib_database"]

[dev-dependencies]
tokio-test = "*"
