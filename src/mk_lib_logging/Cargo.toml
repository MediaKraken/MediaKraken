[package]
name = "mk_lib_logging"
version = "0.0.226"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
elasticsearch = "9.1.0-alpha.1"
reqwest = { version = "0.13.4", default-features = false, features = [
    "http2",
    "json",
    "native-tls",
    "query",
] }
reqwest-middleware = { version = "0.5.2", features = [
    "http2",
    "json",
] }
reqwest-retry = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stdext = "0.3.3"
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"

[dev-dependencies]
tokio-test = "*"
