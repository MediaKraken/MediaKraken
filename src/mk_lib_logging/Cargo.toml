[package]
name = "mk_lib_logging"
version = "0.0.7"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
reqwest = { version = "0.12.9", default-features = false, features = [
    "http2",
    "json",
    "native-tls",
] }
reqwest-middleware = { version = "0.3.3", features = [
    "http2",
    "json",
] }
reqwest-retry = "0.6.1"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
stdext = "0.3.3"

[dev-dependencies]
tokio-test = "*"
