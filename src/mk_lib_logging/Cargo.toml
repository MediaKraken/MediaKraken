[package]
name = "mk_lib_logging"
version = "0.0.38"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
reqwest = { version = "0.12.23", default-features = false, features = [
    "http2",
    "json",
    "native-tls",
] }
reqwest-middleware = { version = "0.4.2", features = [
    "http2",
    "json",
] }
reqwest-retry = "0.7.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
stdext = "0.3.3"
tokio = { version = "1.47.1", features = ["full"] }

[dev-dependencies]
tokio-test = "*"
