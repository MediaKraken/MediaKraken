[package]
name = "mk_lib_common"
version = "0.0.173"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_logging = { version = "0.0.174", registry = "kellnr" }

bytesize = { version = "1.3.2", features = ["serde"] } # 2.0.1 breaks my code
chrono = { version = "0.4.44", features = ["serde"] }
docker-api = { version = "0.14.0", features = ["swarm"] }
futures = "0.3.32"
lazy_static = "1.5.0"
num-format = { version = "0.4.4", features = [
    "with-system-locale",
    "with-num-bigint",
] }
paginator = "0.2.6"
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["full"] }
urlencoding = "2.1.2"

[dev-dependencies]
tokio-test = "*"
