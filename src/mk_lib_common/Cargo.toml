[package]
name = "mk_lib_common"
version = "0.0.237"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_logging = { version = "0.0.238", registry = "kellnr" }

bytesize = { version = "2.7.0", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
docker-api = { version = "0.14.0", features = ["swarm"] }
futures = "0.3.34"
lazy_static = "1.5.0"
num-format = { version = "0.4.4", features = [
    "with-system-locale",
    "with-num-bigint",
] }
paginator = "0.2.7"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
urlencoding = "2.1.2"

[dev-dependencies]
tokio-test = "*"
