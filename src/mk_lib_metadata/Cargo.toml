[package]
name = "mk_lib_metadata"
version = "0.0.260"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.248", registry = "kellnr" }
mk_lib_database = { version = "0.0.281", registry = "kellnr" }
mk_lib_hash = { version = "0.0.251", registry = "kellnr" }
mk_lib_image = { version = "0.0.248", registry = "kellnr" }
mk_lib_logging = { version = "0.0.249", registry = "kellnr" }
mk_lib_network = { version = "0.0.248", registry = "kellnr" }

discid = { version = "0.7.1", optional = true }
flickr = "0.1.1"
hls_m3u8 = "0.7.0"
id3 = "1.17.1"
#lib-mal = "0.5.1"  # myanimelist
mangadex = "0.1.2"
# musicbrainz_rs = { version = "0.5.0", features = ["async"] }
rand = "0.10.2"
reqwest = "0.13.4"
# rusty_ytdl = "0.6.2"  # breaks sscache
select = "0.6.1"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "chrono",
    "ipnetwork",
    "json",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
soundcloud = "0.4.0"
tokio = "1.53.1"
tokio-util = { version = "0.7.19", features = ["compat"] }
url = "2.5"
torrent-name-parser = "0.12.1"
uuid = { version = "1.25.0", features = ["serde", "v4"] }

[features]
discid = ["dep:discid"]
