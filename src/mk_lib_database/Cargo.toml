[package]
name = "mk_lib_database"
version = "0.0.24"
edition = "2021"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.5", registry = "kellnr" }

anyhow = "1.0.88"
async-trait = "0.1.82"
axum_session = { version = "0.14.2", default-features = false, features = [
    "advanced",
    "key-store",
] }
axum_session_auth = { version = "0.14.1", default-features = false, features = [
    "advanced",
    "key-store",
] }
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sqlx = { version = "0.8.2", default-features = false, features = [
    "chrono",
    "ipnetwork",
    "json",
    "macros",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
tokio = { version = "1.40.0", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.10.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
