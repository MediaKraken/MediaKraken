[package]
name = "mk_lib_database"
version = "0.0.267"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.235", registry = "kellnr" }
mk_lib_logging = { version = "0.0.236", registry = "kellnr" }

anyhow = "1.0.103"
async-trait = "0.1.92"
axum_session = { version = "0.21.0", default-features = false, features = [
    "advanced",
    "key-store",
] }
axum_session_auth = { version = "0.21.0", default-features = false, features = [
    "advanced",
    "key-store",
] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
    "chrono",
    "ipnetwork",
    "json",
    "macros",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
tokio = { version = "1.53.1", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.25.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
