[package]
name = "mk_lib_database"
version = "0.0.148"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.116", registry = "kellnr" }
mk_lib_logging = { version = "0.0.117", registry = "kellnr" }

anyhow = "1.0.99"
async-trait = "0.1.89"
axum_session = { version = "0.17.1", default-features = false, features = [
    "advanced",
    "key-store",
] }
axum_session_auth = { version = "0.17.0", default-features = false, features = [
    "advanced",
    "key-store",
] }
chrono = { version = "0.4.43", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "ipnetwork",
    "json",
    "macros",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
tokio = { version = "1.49.0", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.19.0", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tokio-test = "*"
