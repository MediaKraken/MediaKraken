[package]
name = "mk_lib_database"
version = "0.0.21"
edition = "2021"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_common = { version = "0.0.2", registry = "kellnr" }

anyhow = "1.0.86"
async-trait = "0.1.81"
axum_session = { version = "0.14.0", default-features = false, features = [
    "advanced",
    "key-store",
] }
axum_session_auth = { version = "0.14.0", default-features = false, features = [
    "advanced",
    "key-store",
] }
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"
sqlx = { version = "0.7.4", default-features = false, features = [
    "chrono",
    "ipnetwork",
    "json",
    "macros",
    "runtime-tokio",
    "postgres",
    "uuid",
] }
tokio = { version = "1.38.0", features = ["full"] }
urlencoding = "2.1.3"
uuid = { version = "1.10.0", features = ["serde", "v4"] }

[dev-dependencies]
tokio-test = "*"
