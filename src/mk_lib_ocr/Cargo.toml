[package]
name = "mk_lib_ocr"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_logging = { version = "0.0.224", registry = "kellnr" }

tesseract = "0.15.2"
image = "0.25.10"
tokio = { version = "1.52.3", features = ["fs", "process", "rt"] }
serde_json = "1.0"

[build-dependencies]
pkg-config = "0.3"

[dev-dependencies]
tokio-test = "*"
