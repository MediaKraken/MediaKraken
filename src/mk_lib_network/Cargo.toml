[package]
name = "mk_lib_network"
version = "0.0.210"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_file = { version = "0.0.217", registry = "kellnr" }
mk_lib_logging = { version = "0.0.209", registry = "kellnr" }

bytes = "1.11.0"
cidr-utils = { version = "0.5.11", features = [
    "serde",
] } # 0.6.x breaks buildof cidr addr
cotton-ssdp = "0.1.0"
crab-dlna = "0.2.1"
easy-upnp = "0.2.1"
futures = "0.3.31"
futures-util = "0.3.32"
#governor = "0.6.3"
ibverbs = { version = "0.9.2", optional = true } # since docker, no infiniband
igd-next = "0.16.2"
# ipnet = "2.7.2"
ldap3 = "0.11.5"
lettre = "0.11.18"
mini-telnet = "0.1.8"
nonzero_ext = "0.3.0"
openweathermap_client = "0.6.0"
phf = { version = "0.12.1", features = ["macros"] }
pin-utils = "0.1.0"
quickxml_to_serde = { version = "0.6.0", features = ["json_types"] }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
] }
# 4.x breaks my code
reqwest-middleware = "0.3.3"
# 0.7.0 break my code
reqwest-retry = "0.6.1"
rss = "2.0.12"
rsteam = "0.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serialport = "4.7.3"
ssh-rs = { version = "0.5.0", features = ["scp"] }
suppaftp = { version = "6.3.0", features = ["native-tls"] }
surge-ping = "0.8.3"
telnet = "0.2.4"
tokio = { version = "1.49.0", features = ["full"] }
transmission-rpc = "0.5.0"
wakey = "0.3.0"

[features]
infiniband = ["dep:ibverbs"]

[dev-dependencies]
tokio-test = "*"
