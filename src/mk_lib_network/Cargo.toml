[package]
name = "mk_lib_network"
version = "0.0.237"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
mk_lib_file = { version = "0.0.247", registry = "kellnr" }
mk_lib_logging = { version = "0.0.238", registry = "kellnr" }

bytes = "1.12.1"
cidr-utils = "0.7.1" # 0.6+ removed serde feature; 0.5.x Ipv4Cidr renamed
cotton-ssdp = "0.1.0"
crab-dlna = "0.2.1"
easy-upnp = "0.3.2"
futures = "0.3.34"
futures-util = "0.3.34"
#governor = "0.6.3"
ibverbs = { version = "0.9.2", optional = true } # since docker, no infiniband
igd-next = "0.17.1"
# ipnet = "2.7.2"
ldap3 = "0.12.1"
lettre = "0.11.23"
mini-telnet = "0.1.8"
nonzero_ext = "0.3.0"
openweathermap_client = "0.7.0"
phf = { version = "0.14.0", features = ["macros"] }
pin-utils = "0.1.0"
quickxml_to_serde = { version = "0.7.1", features = ["json_types"] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "native-tls",
] }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
rss = "2.1.0"
rsteam = "0.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.9.0"
ssh-rs = { version = "0.5.0", features = ["scp"] }
suppaftp = { version = "10.0.2", features = ["native-tls"] }
surge-ping = "0.9.0"
telnet = "0.2.5"
tokio = { version = "1.53.1", features = ["full"] }
transmission-rpc = "0.5.0"
wakey = "0.4.1"

[features]
infiniband = ["dep:ibverbs"]

[dev-dependencies]
tokio-test = "*"
