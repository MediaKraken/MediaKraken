[package]
name = "mk_lib_xbox"
version = "0.0.1"
edition = "2024"

[profile.release]
panic = 'abort'
strip = "symbols"
lto = true
codegen-units = 1

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "native-tls",
] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
xbox = "0.2.0"
