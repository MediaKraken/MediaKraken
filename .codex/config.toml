# ---- which model to use by default ----
model = "qwen36-35b-a3b-ud-q4_k_xl"
model_provider = "llamacpp"

# ---- your llama.cpp coder server ----
[model_providers.llamacpp]
name = "Local llama.cpp on skynetgpu1"
base_url = "http://skynetgpu1:8000/v1"
env_key = "LLAMACPP_API_KEY"   # value doesn't matter, llama.cpp ignores it
wire_api = "responses"              # CRITICAL — see below
request_max_retries = 4
stream_idle_timeout_ms = 600000      # 10 min — thinking pauses won't kill the stream
requires_openai_auth = false  

# ---- Qdrant MCP server for semantic code search ----
# [mcp_servers.code_search]
# url = "http://skynetmem1:9876/mcp"
# startup_timeout_sec = 10

[mcp_servers.mediakraken_search]
url = "http://skynetmem1:9876/mcp"   # instance with COLLECTION_NAME=mediakraken
startup_timeout_sec = 10

# [mcp_servers.bmo_search]
# url = "http://skynetmem1:9877/mcp"   # instance with COLLECTION_NAME=bmo_core
# startup_timeout_sec = 10

[models."qwen36-35b-a3b-ud-q6_k_xl"]
context_window = 131072
max_output_tokens = 32768

