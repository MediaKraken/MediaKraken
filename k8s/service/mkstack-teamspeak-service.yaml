apiVersion: v1
kind: Service
metadata:
  name: mkstack-teamspeak-service
  namespace: mediakraken
spec:
  type: NodePort
  ports:
    - name: "9987"
      port: 9987
      protocol: UDP
      targetPort: 9987
    - name: "10011"
      port: 10011
      targetPort: 10011
    - name: "30033"
      port: 30033
      targetPort: 30033
  selector:
    io.kompose.service: mkstack-teamspeak-service
