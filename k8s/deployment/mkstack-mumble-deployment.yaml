apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-mumble
  name: mkstack-mumble
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-mumble-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-mumble-service
    spec:
      containers:
        - env:
            - name: SUPERUSER_PASSWORD
              value: metaman
          image: mediakraken/mkchatmumble:dev
          imagePullPolicy: Always
          name: mkstack-mumble
          ports:
            - containerPort: 64738
              protocol: TCP
            - containerPort: 64738
              protocol: UDP
          volumeMounts:
            - mountPath: /etc/mumble
              name: mkstack-mumble-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-mumble-claim
          persistentVolumeClaim:
            claimName: mkstack-mumble-claim
