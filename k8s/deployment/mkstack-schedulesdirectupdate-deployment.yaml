apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-schedulesdirectupdate
  name: mkstack-schedulesdirectupdate
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-schedulesdirectupdate-service
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-schedulesdirectupdate-service
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkschedulesdirectupdate
          env:
            - name: WAIT_HOSTS
              value: mkstack-database-service:5432, mkstack-rabbitmq-service:5672
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: mkstack-db-password.txt
          image: mediakraken/mkschedulesdirectupdate:dev
          imagePullPolicy: Always
          name: mkstack-schedulesdirectupdate
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
