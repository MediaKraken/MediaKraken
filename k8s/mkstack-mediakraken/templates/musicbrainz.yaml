apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mkstack-mbrainz-claim
  namespace: mkstack-mediakraken
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nfs-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-musicbrainz
  name: mkstack-musicbrainz
  namespace: mkstack-mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-musicbrainz-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-musicbrainz-service
    spec:
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkmusicbrainz
          env:
            - name: WAIT_HOSTS
              value: mkdatabase.stackgres:5432, mkstack-rabbitmq-service:5672
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: db-password
          image: mediakraken/mkmusicbrainz:dev
          imagePullPolicy: Always
          name: mkstack-musicbrainz
          volumeMounts:
            - mountPath: /mediakraken/mbdump
              name: mkstack-mbrainz-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-mbrainz-claim
          persistentVolumeClaim:
            claimName: mkstack-mbrainz-claim
