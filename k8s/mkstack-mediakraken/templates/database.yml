---
apiVersion: stackgres.io/v1
kind: SGPoolingConfig
metadata:
  name: mkpoolconfig
  namespace: stackgres
spec:
  pgBouncer:
    pgbouncer.ini:
      pgbouncer:
        pool_mode: transaction
        max_client_conn: '2000'
        default_pool_size: '100'
        log_connections: '1'
        log_disconnections: '1'
        log_stats: '1'
        server_idle_timeout: '120'
        client_idle_timeout: '30'
        query_wait_timeout: '300'
      databases:
        postgres:
          pool_size: 400 
          dbname: 'postgres'
          reserve_pool: 5
---
apiVersion: stackgres.io/v1
kind: SGPostgresConfig
metadata:
  namespace: stackgres
  name: mkpgconfig
spec:
  postgresVersion: "16"
  postgresql.conf:
    shared_buffers: '16GB'
    random_page_cost: '1'
    checkpoint_timeout: '15min'
    max_connections: '400'
    work_mem: '128MB'
    effective_cache_size: '100GB'
    max_wal_size: '100GB'
    min_wal_size: '20GB'
    max_worker_processes: '16'
    max_parallel_workers_per_gather: '4'
    max_parallel_workers: '16'
    autovacuum_vacuum_scale_factor : '0.05'
    autovacuum_analyze_scale_factor : '0.02'
    autovacuum_max_workers: '8'
    log_min_duration_statement: '1000'
    log_checkpoints: 'on'
    log_connections: 'on'
    log_disconnections: 'on'
    idle_in_transaction_session_timeout: '600000'
    checkpoint_completion_target: '0.9'
    default_statistics_target: '250'
    hot_standby_feedback: 'on'
    shared_preload_libraries: 'pg_repack,pg_stat_statements,auto_explain,timescaledb'
    max_logical_replication_workers: '12'
    max_sync_workers_per_subscription: '2'
    autovacuum: 'on'
    max_parallel_maintenance_workers: '8'
    maintenance_work_mem: '8GB'
    vacuum_cost_limit: '1000'
    autovacuum_vacuum_cost_limit: '1000'
    geqo_threshold: '16'
    join_collapse_limit: '16'
    autovacuum_freeze_max_age: '500000000'
---
apiVersion: stackgres.io/v1
kind: SGCluster
metadata:
  namespace: stackgres
  name: mkdbinstance
spec:
  postgres:
    version: "16"
    extensions:
    - name: pg_repack
      version: "1.5.2"
    - name: pg_trgm
    - name: pgcrypto
    - name: pg_stat_statements
    - name: timescaledb
      version: "2.18.2"
    - name: vector
      version: "0.8.0"
    - name: vectorscale
      version: "0.6.0"
  instances: 2
  sgInstanceProfile: 'mkprodprofile'
  pods:
    persistentVolume:
      size: '512Gi'
      storageClass: 'local-path'
    scheduling:
      tolerations:
        - key: "stackgres"
          operator: "Exists"
          effect: "NoSchedule"
  configurations:
    sgPostgresConfig: 'mkpgconfig'
    sgPoolingConfig: 'mkpoolconfig'
    # backups:
    # - sgObjectStorage: 'backupconfig'
    #   cronSchedule: '30 02 */4 * *'
    #   retention: 4
    #   compression: lz4
    #   performance:
    #     maxDiskBandwidth: 26214400 #25 MB per seceod
    #     maxNetworkBandwidth: 52428800 #50 MB per second
    #     uploadDiskConcurrency: 2
  distributedLogs:
    sgDistributedLogs: 'mkdistributedlogs'
  postgresServices:
    primary:
      type: LoadBalancer
    replicas:
      type: ClusterIP
  prometheusAutobind: true
