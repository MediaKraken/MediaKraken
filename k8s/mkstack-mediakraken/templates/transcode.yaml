apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mkstack-transcode-claim
  namespace: mediakraken
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-transcode
  name: mkstack-transcode
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-transcode-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-transcode-service
    spec:
      containers:
        - name: mkstack-transcode
          image: mediakraken/mktranscode:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - /mktranscode
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: password
            - name: DEBUG
              valueFrom:
                secretKeyRef:
                  name: run-env-type
                  key: debug
          volumeMounts:
            - name: mkstack-transcode-claim
              mountPath: /mediakraken/mnt
              readOnly: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-transcode-claim
          persistentVolumeClaim:
            claimName: mkstack-transcode-claim