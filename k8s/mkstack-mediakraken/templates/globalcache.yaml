apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-globalcache
  name: mkstack-globalcache
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-globalcache-service
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-globalcache-service
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkglobalcache
          env:
            - name: WAIT_HOSTS
              value: pgcluster-with-metrics-rw.cnpg-system:5432, mkstack-rabbitmq-production.rabbitmq-system:5672
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: password
          image: mediakraken/mkglobalcache:dev
          imagePullPolicy: Always
          name: mkstack-globalcache
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
