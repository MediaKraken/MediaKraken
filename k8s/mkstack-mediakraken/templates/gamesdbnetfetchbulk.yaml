apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-gamesdbnetfetchbulk
  name: mkstack-gamesdbnetfetchbulk
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-gamesdbnetfetchbulk-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-gamesdbnetfetchbulk-service
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkgamesdbnetfetchbulk
          env:
            - name: WAIT_HOSTS
              value: mkdatabase.stackgres:5432, mkstack-rabbitmq-service:5672
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: db-password
          image: mediakraken/mkgamesdbnetfetchbulk:dev
          imagePullPolicy: Always
          name: mkstack-gamesdbnetfetchbulk
          volumeMounts:
            - mountPath: /metadata
              name: mkstack-metadata-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-metadata-claim
          persistentVolumeClaim:
            claimName: mkstack-metadata-claim
