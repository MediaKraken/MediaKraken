apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mkstack-transmission-claim
  namespace: mediakraken
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mkstack-transmission-downloads-claim
  namespace: mediakraken
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 256Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mkstack-transmission-incomplete-claim
  namespace: mediakraken
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 512Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: mkstack-transmission-service
  namespace: mediakraken
spec:
  type: NodePort
  ports:
    - name: "9091"
      port: 9091
      targetPort: 9091
      nodePort: 30091
    - name: "51413"
      port: 51413
      targetPort: 51413
    - name: 51413-udp
      port: 51413
      protocol: UDP
      targetPort: 51413
  selector:
    io.kompose.service: mkstack-transmission-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-transmission
  name: mkstack-transmission
  namespace: mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-transmission-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-transmission-service
    spec:
      securityContext:
        fsGroup: 100
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 100
      initContainers:
        # Repair the config dir on the PVC before the daemon starts:
        #  - a corrupted legacy state can leave a *directory* where
        #    settings.json belongs; remove it so the start script can seed
        #    a real file (this is also what breaks subPath file mounts)
        #  - the dir may contain root-owned files from an earlier root run;
        #    the non-root daemon needs to write them
        # Best-effort throughout: on a volume where root cannot operate
        # (NFS root-squash) the main container still starts, because the
        # start script and the daemon only need write access to the
        # directory itself (fsGroup: 100).
        - name: chown-settings
          image: mediakraken/mktransmission:dev
          imagePullPolicy: Always
          command:
            - sh
            - -c
            - |
              [ -d /etc/transmission-daemon/settings.json ] && rm -rf /etc/transmission-daemon/settings.json 2>/dev/null
              chown -R 100:100 /etc/transmission-daemon 2>/dev/null
              exit 0
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - mountPath: /etc/transmission-daemon
              name: mkstack-transmission-claim
      containers:
        - image: mediakraken/mktransmission:dev
          imagePullPolicy: Always
          name: mkstack-transmission
          ports:
            - containerPort: 9091
              protocol: TCP
            - containerPort: 51413
              protocol: TCP
            - containerPort: 51413
              protocol: UDP
          volumeMounts:
            - mountPath: /etc/transmission-daemon
              name: mkstack-transmission-claim
            - mountPath: /transmission/downloads
              name: mkstack-transmission-downloads-claim
            - mountPath: /transmission/incomplete
              name: mkstack-transmission-incomplete-claim
      restartPolicy: Always
      volumes:
        - name: mkstack-transmission-claim
          persistentVolumeClaim:
            claimName: mkstack-transmission-claim
        - name: mkstack-transmission-downloads-claim
          persistentVolumeClaim:
            claimName: mkstack-transmission-downloads-claim
        - name: mkstack-transmission-incomplete-claim
          persistentVolumeClaim:
            claimName: mkstack-transmission-incomplete-claim
