apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mkstack-webapp-tls
  namespace: mediakraken
spec:
  clusterIssuer: letsencrypt-cluster
  dnsNames:
    - mk.mediakraken.media
  secretName: letsencrypt-webapp-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mkstack-webapp
  namespace: mediakraken
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: letsencrypt-webapp-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mkstack-webapp-redirect
  namespace: mediakraken
spec:
  parentRefs:
    - name: mkstack-webapp
      sectionName: http
  hostnames:
    - mk.mediakraken.media
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mkstack-webapp-route
  namespace: mediakraken
spec:
  parentRefs:
    - name: mkstack-webapp
      sectionName: https
  hostnames:
    - mk.mediakraken.media
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mkstack-webapp-service
          port: 80
