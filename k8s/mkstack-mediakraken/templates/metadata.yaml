apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mkstack-metadata-claim
  namespace: mkstack-mediakraken
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 250Gi
  storageClassName: nfs-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: mkstack-metadata
  name: mkstack-metadata
  namespace: mkstack-mediakraken
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mkstack-metadata-service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: mkstack-metadata-service
    spec:
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - args:
            - sh
            - -c
            - /wait && /mkmetadata
          env:
            - name: WAIT_HOSTS
              value: mkstack-database-service:5432, mkstack-rabbitmq-service:5672
            - name: WAIT_TIMEOUT
              value: "180"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-password
                  key: mkstack-db-password.txt
          image: mediakraken/mkmetadata:dev
          imagePullPolicy: Always
          name: mkstack-metadata
          volumeMounts:
            - mountPath: /mediakraken/metadata
              name: mkstack-metadata-claim
            - mountPath: /mediakraken/cache
              name: mkstack-cache-claim
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
        - name: mkstack-metadata-claim
          persistentVolumeClaim:
            claimName: mkstack-metadata-claim
        - name: mkstack-cache-claim
          persistentVolumeClaim:
            claimName: mkstack-cache-claim
