---
# https://stackgres.io/doc/latest/install/helm/
- name : Setup stackgres on cluster
  hosts: mkcontrol1
  tasks:
    - name: Add repo
      shell: helm repo add stackgres-charts https://stackgres.io/downloads/stackgres-k8s/stackgres/helm/

    - name: Install
      shell: helm install --create-namespace --namespace stackgres stackgres-operator \
        --set grafana.autoEmbed=true \
        --set-string grafana.webHost=monitoring-grafana.monitoring \
        --set-string grafana.secretNamespace=monitoring \
        --set-string grafana.secretName=monitoring-grafana \
        --set-string grafana.secretUserKey=admin-user \
        --set-string grafana.secretPasswordKey=admin-password \
        stackgres-charts/stackgres-operator

