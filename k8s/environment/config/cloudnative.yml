---
apiVersion: v1
kind: Secret
metadata:
  name: dbcluster-app-user
  namespace: cnpg-system
type: kubernetes.io/basic-auth
stringData:
  username: metaman
  password: metaman
---
apiVersion: v1
kind: Secret
metadata:
  name: dbcluster-superuser
  namespace: cnpg-system  
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  password: metamanadmin
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pgcluster-with-metrics
  namespace: cnpg-system
spec:
  instances: 2
  startDelay: 300
  stopDelay: 300
  imageName: ghcr.io/cloudnative-pg/postgis:18.1-3.6.1-202512151010-system-trixie
  primaryUpdateStrategy: unsupervised
  storage:
    size: 300Gi
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 300Gi
      storageClassName: local-path
      volumeMode: Filesystem
  postgresql:
    shared_preload_libraries:
      - "pg_stat_statements"
      - "auto_explain"
#      - "timescaledb"
    parameters:
      pg_stat_statements.max: '10000'
      pg_stat_statements.track: all
      auto_explain.log_min_duration: '1s'  
#       autovacuum_vacuum_cost_delay: "2ms"
      max_connections: "100"
      shared_buffers: "12GB"
      effective_cache_size: "36GB"
      maintenance_work_mem: "2GB"
#       checkpoint_segments: "6"
#       checkpoint_completion_target: "0.9"
#       checkpoint_timeout: "15min"
#       default_statistics_target: "100"
#       random_page_cost: "1"
#       effective_io_concurrency: "200"
#       work_mem: "116508kB"
# #      huge_pages: "try"
      max_worker_processes: "10"
      max_parallel_workers_per_gather: "4"
      max_parallel_workers: "10"
      max_parallel_maintenance_workers: "4"
#       log_min_duration_statement: "1s"
#       log_temp_files: "0kB"
      tcp_keepalives_count: "9"
      tcp_keepalives_idle: "5min"
      tcp_keepalives_interval: "75s"
      track_activity_query_size: "4kB"  
    pg_hba:
      - host all all all md5  
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector-0.8.1-202512171405-18-trixie
      # - name: timescaledb
      #   image:
      #     reference: ghcr.io/cloudnative-pg/timescaledb:2.23.1-18-trixie
  pgbouncer:
      poolMode: session
      parameters:
        max_client_conn: "1000"
        default_pool_size: "10"
  bootstrap:
    initdb:
      database: mkdatabase
      owner: metaman
      secret:
        name: dbcluster-app-user
      postInitTemplateSQL:
        - CREATE EXTENSION postgis;        
        - CREATE EXTENSION pg_trgm;
        - CREATE EXTENSION pgcrypto
        #- CREATE EXTENSION timescaledb
        - CREATE EXTENSION vector;
        #- CREATE EXTENSION vectorscale;
    # Alternative bootstrap method: start from a backup
    #recovery:
    #  backup:
    #    name: backup-devenv
  enableSuperuserAccess: true
  superuserSecret:
    name: dbcluster-superuser
  backup:
      barmanObjectStore:
        destinationPath: "s3://mkdbbackups/prod"
        endpointURL: http://mkdbbackups.garage.mediakraken.media::3900
        s3Credentials:
          accessKeyId:
            name: s3-backup-creds
            key: ACCESS_KEY_ID
          secretAccessKey:
            name: s3-backup-creds
            key: ACCESS_SECRET_KEY
          region:
            name: s3-backup-creds
            key: AWS_REGION
        wal:
          compression: gzip
          encryption:
          maxParallel: 8
        data:
          compression: gzip
          encryption:
          immediateCheckpoint: false
          jobs: 2
      retentionPolicy: "30d"
  resources:
    requests:
      memory: "32Gi"
      cpu: "12"
    limits:
      memory: "48Gi"
      cpu: "20"
  affinity:
    enablePodAntiAffinity: true
    topologyKey: failure-domain.beta.kubernetes.io/zone
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: false
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgcluster-with-metrics-pgbouncer-rw
  namespace: cnpg-system
spec:
  cluster:
    name: pgcluster-with-metrics
  instances: 2
  type: rw  # rw | ro
  pgbouncer:
    poolMode: session # session | transaction | statement
    parameters:
      max_client_conn: "5000"
      default_pool_size: "90"
---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgcluster-with-metrics-pgbouncer-ro
  namespace: cnpg-system
spec:
  cluster:
    name: pgcluster-with-metrics
  instances: 2
  type: ro  # rw | ro
  pgbouncer:
    poolMode: session # session | transaction | statement
    parameters:
      max_client_conn: "5000"
      default_pool_size: "90"
---
kind: PodMonitor
metadata:
  name: pgcluster-with-metrics
  namespace: cnpg-system
  labels:
      release: kube-prometheus-stack  
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pgcluster-with-metrics
  podMetricsEndpoints:
  - port: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-controller-manager
  namespace: cnpg-system
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  podMetricsEndpoints:
    - port: metrics
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: backup-devenv
  namespace: cnpg-system  
spec:
  cluster:
    name: pgcluster-with-metrics