[kube_node]
mkworker1 ansible_host=192.168.1.80  # ip=10.3.0.4 etcd_member_name=etcd4
mkworker2 ansible_host=192.168.1.81  # ip=10.3.0.5 etcd_member_name=etcd5
mkworker3 ansible_host=192.168.1.82  # ip=10.3.0.6 etcd_member_name=etcd6
mkworker4 ansible_host=192.168.1.83  # ip=10.3.0.7 etcd_member_name=etcd7
mkworker5 ansible_host=192.168.1.84  # ip=10.3.0.8 etcd_member_name=etcd8

[kube_control_plane:vars]
node_labels={"workload_type":"control_plane"}

[kube_node:vars]
node_labels={"workload_type":"worker"}

[calico_rr]

[k8s_cluster:children]
kube_control_plane
kube_node
calico_rr
