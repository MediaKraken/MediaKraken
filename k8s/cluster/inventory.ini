[kube_control_plane]
mkcontrol1 ansible_host=192.168.1.70  # ip=10.3.0.1 etcd_member_name=etcd1
mkcontrol2 ansible_host=192.168.1.71  # ip=10.3.0.2 etcd_member_name=etcd2
mkcontrol3 ansible_host=192.168.1.72  # ip=10.3.0.3 etcd_member_name=etcd3

[etcd:children]
