---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cluster
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: qgranfor@yahoo.com
    privateKeySecretRef:
      name: letsencrypt-cluster
    solvers:
    - dns01:
        route53:
          region: us-east-1
          accessKeyID: vm_aws_access_key
          secretAccessKeySecretRef:
            name: aws-route53-creds
            key: password.txt