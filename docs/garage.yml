---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: garagenodes.deuxfleurs.fr
spec:
  group: deuxfleurs.fr
  scope: Namespaced
  names:
    kind: GarageNode
    listKind: GarageNodeList
    plural: garagenodes
    singular: garagenode
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: Namespace
metadata:
  name: garage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: garage
  namespace: garage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage
  namespace: garage
rules:
  - apiGroups: ["deuxfleurs.fr"]
    resources: ["garagenodes"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage
  namespace: garage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage
subjects:
  - kind: ServiceAccount
    name: garage
    namespace: garage
---
apiVersion: v1
kind: Secret
metadata:
  name: garage-secrets
  namespace: garage
type: Opaque
stringData:
  rpc_secret: "a75bcef1b4ac16be735e76e69851c15c05317d08afd9dd8f0bc5700ef512af2c"
  admin_token: "o6xSqzB8+guNdKDc+mctRDSaErI4N+YVeOEk4cI5qHw="
  metrics_token: "8MA4SIXu4dO3h89l5qJ+/n6wuDnNJBktUb/vYr5N4Po="
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir     = "/var/lib/garage/data"

    db_engine                       = "lmdb"
    metadata_auto_snapshot_interval = "6h"

    # No replication: each object/block is stored on exactly one node.
    # Tolerates zero node failures.
    replication_factor = 1

    compression_level = 2

    rpc_bind_addr   = "[::]:3901"
    rpc_secret_file = "/etc/garage/secrets/rpc_secret"
    # rpc_public_addr is intentionally omitted — kubernetes_discovery
    # auto-registers this pod's IP in the GarageNode CRD.

    # Kubernetes mounts secret volumes with group-readable mode (0440) when
    # fsGroup is set, which Garage flags as "world-readable". The secret
    # volume is only visible inside this pod, so we allow it.
    allow_world_readable_secrets = true
    
    [kubernetes_discovery]
    namespace    = "garage"
    service_name = "garage"
    skip_crd     = true

    [s3_api]
    s3_region     = "garage"
    api_bind_addr = "[::]:3900"
    root_domain   = ".s3.garage.local"

    [s3_web]
    bind_addr   = "[::]:3902"
    root_domain = ".web.garage.local"
    index       = "index.html"

    [k2v_api]
    api_bind_addr = "[::]:3904"

    [admin]
    api_bind_addr      = "[::]:3903"
    admin_token_file   = "/etc/garage/secrets/admin_token"
    metrics_token_file = "/etc/garage/secrets/metrics_token"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: garage
  labels:
    app: garage
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: 3901
---
apiVersion: v1
kind: Service
metadata:
  name: garage-api
  namespace: garage
  labels:
    app: garage
spec:
  type: ClusterIP
  selector:
    app: garage
  ports:
    - name: s3-api
      port: 3900
      targetPort: 3900
    - name: s3-web
      port: 3902
      targetPort: 3902
    - name: admin
      port: 3903
      targetPort: 3903
    - name: k2v
      port: 3904
      targetPort: 3904
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  namespace: garage
  labels:
    app: garage
spec:
  serviceName: garage
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      serviceAccountName: garage
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
      containers:
        - name: garage
          image: dxflrs/garage:v2.3.0
          imagePullPolicy: IfNotPresent
          command:
            - /garage
          args:
            - server
          ports:
            - name: rpc
              containerPort: 3901
            - name: s3-api
              containerPort: 3900
            - name: s3-web
              containerPort: 3902
            - name: admin
              containerPort: 3903
            - name: k2v
              containerPort: 3904
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
            - name: secrets
              mountPath: /etc/garage/secrets
              readOnly: true
            - name: meta
              mountPath: /var/lib/garage/meta
            - name: data
              mountPath: /var/lib/garage/data
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: garage-config
        - name: secrets
          secret:
            secretName: garage-secrets
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: meta
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "topolvm-xfs-meta"
        resources:
          requests:
            storage: 500Gi
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "topolvm-xfs-data"
        resources:
          requests:
            storage: 9000Gi
